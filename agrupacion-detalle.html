<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!--
      v3.0 — G-30: este archivo era un prototipo viejo con datos de ejemplo
      hardcodeados ("Pieza 1", "Pieza 2", un botón que simulaba borrar con
      alert()). Quedó sin usarse desde que repertorio.html tomó su lugar,
      pero no estaba enlazado desde ningún menú — solo alguien con la URL
      vieja guardada podía llegar a él y ver información falsa que parecía
      real. En vez de borrarlo (podría romper un link viejo compartido),
      redirige automáticamente a la página real, conservando cualquier
      parámetro de la URL (?agrupacion=...) por si el link viejo lo traía.
    -->
    <meta http-equiv="refresh" content="0; url=repertorio.html">
    <title>Redirigiendo… – Sistema de Orquestas</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=16.0">
    <script>
      const params = window.location.search || "";
      window.location.replace("repertorio.html" + params);
    </script>
</head>
<body style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,sans-serif;color:#4138A9;">
    <p>Redirigiendo a Repertorio… si no pasa nada, <a href="repertorio.html">hacé clic acá</a>.</p>
</body>
</html>
