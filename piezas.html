<!DOCTYPE html>
<html lang="es-VE">
<head>
<script>if(localStorage.getItem("darkMode")==="true")document.documentElement.classList.add("dark-mode");</script>
<script>
  if (!sessionStorage.getItem("sistemaOrquestas_session") && !localStorage.getItem("sistemaOrquestas_session")) { window.location.href = "login.html"; }
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrupaciones – Sistema de Orquestas</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=22.0">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=22.0">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=22.0">
    <meta property="og:title" content="Agrupaciones — Sistema de Orquestas">
    <meta property="og:description" content="Agrupaciones y repertorio de tu núcleo.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="icon-512.png">
    <link rel="stylesheet" href="estilos.css?v=22.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style></style>
</head>
<body>
    <header class="barra-superior">
        <img src="datos.png" alt="Gobierno de Venezuela" style="max-height:50px;" />
        <nav id="user-nav" class="user-nav"></nav>
    </header>
    <div class="volver-barra"><a class="back-link" id="volver" href="panel.html"><i class="fa-solid fa-arrow-left"></i> Volver al panel</a></div>
    <main class="contenido-web container pagina-interior">
        <div class="pagina-cab">
            <div><h1 class="pagina-titulo">Agrupaciones</h1><p class="pagina-sub" id="sub-nucleo"></p></div>
            <button type="button" id="btn-nueva-agr" class="btn btn-submit" style="display:none;"><i class="fa-solid fa-plus"></i> Nueva agrupación</button>
        </div>
        <div class="grid-tarjetas" id="grid" aria-live="polite"></div>
    </main>
    <footer class="pie-pagina"><div class="footer-contenido"><p>© 2026 Fundación Musical Simón Bolívar</p></div></footer>

    <script src="check-entorno.js" defer></script>
    <script type="module" src="auth.js?v=22.0"></script>
    <script type="module" src="ui-manager.js?v=22.0"></script>
    <script type="module">

        import { db } from "./firebase-init.js";
        import { conNucleoActivo } from "./nucleo-activo.js";
        import { abrirPanel, menuContextual, esc } from "./ui-componentes.js";
        import { crearAgrupacion, renombrarAgrupacion, eliminarAgrupacion, resumenAgrupacion, validarNombreAgrupacion } from "./agrupaciones.js";
        import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        const $ = (id) => document.getElementById(id);
        const GESTORES = ["owner_supremo", "director_nacional", "director_regional", "director_nucleo", "admin"];

        function iniciar() {
            const session = window.Auth?.getSession();
            if (!session) { window.location.href = "index.html"; return; }
            const real = window.Auth.getRealSession() || session;
            const puedeGestionar = GESTORES.includes(session.role) && GESTORES.includes(real.role);
            let nucleo = null, agrupaciones = [], conteo = new Map(), listo = { a: false, p: false }, unsubs = [];

            conNucleoActivo((n) => { nucleo = n; suscribir(); });

            function suscribir() {
                unsubs.forEach((u) => u()); unsubs = []; agrupaciones = []; conteo = new Map(); listo = { a: false, p: false };
                $("sub-nucleo").textContent = nucleo ? `${nucleo.nombre}${nucleo.estado ? " · " + nucleo.estado : ""}` : "";
                $("btn-nueva-agr").style.display = puedeGestionar && nucleo ? "inline-flex" : "none";
                pintar();
                if (!nucleo) return;
                unsubs.push(onSnapshot(query(collection(db, "agrupaciones"), where("nucleo", "==", nucleo.nombre)), (s) => {
                    agrupaciones = s.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => a.nombre.localeCompare(b.nombre)); listo.a = true; pintar();
                }, (e) => { listo.a = true; console.error(e); window._showToast?.("No se pudieron cargar las agrupaciones", "error"); pintar(); }));
                unsubs.push(onSnapshot(query(collection(db, "piezas"), where("nucleo", "==", nucleo.nombre)), (s) => {
                    conteo = new Map(); s.docs.forEach((d) => { const k = d.data().agrupacionId; conteo.set(k, (conteo.get(k) || 0) + 1); }); listo.p = true; pintar();
                }, (e) => { listo.p = true; console.error(e); pintar(); }));
            }

            function pintar() {
                const grid = $("grid");
                if (!nucleo) { grid.innerHTML = `<div class="estado-vacio"><i class="fa-solid fa-building-columns"></i><h3>Elige un núcleo</h3><p>Usa el botón <strong>Núcleos</strong> (abajo a la derecha) para elegir o crear uno.</p></div>`; return; }
                if (!listo.a) { grid.innerHTML = Array.from({ length: 3 }, () => `<div class="skeleton" style="height:210px;border-radius:22px;"></div>`).join(""); return; }
                if (!agrupaciones.length) {
                    grid.innerHTML = `<div class="estado-vacio"><i class="fa-solid fa-music"></i><h3>Todavía no hay agrupaciones en ${esc(nucleo.nombre)}</h3><p>Una agrupación reúne el repertorio de una orquesta o coro.</p>${puedeGestionar ? `<button type="button" class="btn btn-submit" id="vacio-crear"><i class="fa-solid fa-plus"></i> Crear la primera agrupación</button>` : ""}</div>`;
                    $("vacio-crear")?.addEventListener("click", abrirCrear); return;
                }
                grid.innerHTML = agrupaciones.map((a, i) => {
                    const n = conteo.get(a.id) || 0;
                    return `<article class="pin-card clic" data-id="${esc(a.id)}" style="animation-delay:${Math.min(i, 8) * 40}ms">
                        <a class="pin-enlace" href="repertorio.html?id=${encodeURIComponent(a.id)}" aria-label="Abrir ${esc(a.nombre)}"></a>
                        <div class="pin-portada"><i class="fa-solid fa-music"></i></div>
                        <div class="pin-body"><span class="eyebrow">Agrupación</span><h3>${esc(a.nombre)}</h3><p class="pin-meta">${n} ${n === 1 ? "pieza" : "piezas"}</p></div>
                        ${puedeGestionar ? `<div class="card-acciones"><button type="button" class="btn-mas" data-menu="${esc(a.id)}" aria-label="Opciones de ${esc(a.nombre)}" aria-haspopup="menu"><i class="fa-solid fa-ellipsis"></i></button></div>` : ""}
                    </article>`;
                }).join("");
            }
            // enlace que cubre la tarjeta (la tarjeta entera es clicable sin anidar un botón dentro de un <a>)
            const st = document.createElement("style");
            st.textContent = ".pin-enlace{position:absolute;inset:0;z-index:1}.pin-card .card-acciones{z-index:3}";
            document.head.appendChild(st);

            $("grid").addEventListener("click", (e) => {
                const b = e.target.closest("[data-menu]"); if (!b) return;
                const a = agrupaciones.find((x) => x.id === b.dataset.menu); if (!a) return;
                menuContextual(b, [
                    { icono: "fa-pen", texto: "Cambiar nombre", onClick: () => abrirNombre(a) },
                    { separador: true },
                    { icono: "fa-trash", texto: "Eliminar", peligro: true, onClick: () => eliminar(a) },
                ]);
            });
            $("btn-nueva-agr").addEventListener("click", abrirCrear);

            function abrirNombre(a) {
                const editando = !!a;
                const p = abrirPanel({
                    titulo: editando ? "Cambiar nombre" : "Nueva agrupación",
                    subtitulo: `<i class="fa-solid fa-location-dot"></i> ${esc(nucleo.nombre)}${nucleo.estado ? " · " + esc(nucleo.estado) : ""}`,
                    cuerpoHTML: `<label for="agr-nombre">Nombre de la agrupación</label><input id="agr-nombre" type="text" maxlength="80" autocomplete="off" value="${esc(a?.nombre || "")}" placeholder="Ej. Orquesta Juvenil"><p class="error-campo" id="agr-error" role="alert"></p>`,
                    pieHTML: `<button type="button" class="btn btn-cerrar" id="agr-cancelar">Cancelar</button><button type="button" class="btn btn-submit" id="agr-guardar">${editando ? "Guardar" : "Crear agrupación"}</button>`,
                });
                const inp = p.panel.querySelector("#agr-nombre"), err = p.panel.querySelector("#agr-error"), btn = p.panel.querySelector("#agr-guardar");
                p.panel.querySelector("#agr-cancelar").addEventListener("click", p.cerrar);
                const guardar = async () => {
                    const msg = validarNombreAgrupacion(inp.value, agrupaciones, a?.id); err.textContent = msg; if (msg) { inp.focus(); return; }
                    const nuevo = inp.value.trim(); btn.disabled = true; btn.textContent = "Guardando…";
                    try {
                        if (editando) { if (nuevo !== a.nombre) { const n = await renombrarAgrupacion({ id: a.id, viejo: a.nombre, nuevo, nucleo: nucleo.nombre, estado: nucleo.estado }); window._showToast?.(`Nombre cambiado (${n} registro(s) actualizados)`, "success"); } }
                        else { await crearAgrupacion({ nombre: nuevo, nucleo: nucleo.nombre, estado: nucleo.estado, uid: real.uid }); window._showToast?.(`Agrupación "${nuevo}" creada`, "success"); }
                        p.cerrar();
                    } catch (e) { console.error(e); err.textContent = "No se pudo guardar: " + e.message; btn.disabled = false; btn.textContent = editando ? "Guardar" : "Crear agrupación"; }
                };
                btn.addEventListener("click", guardar); inp.addEventListener("keydown", (e) => { if (e.key === "Enter") guardar(); });
            }
            function abrirCrear() { abrirNombre(null); }

            async function eliminar(a) {
                let r;
                try { r = await resumenAgrupacion({ ...a, estado: nucleo.estado }); } catch (e) { window._showToast?.("No se pudo revisar la agrupación: " + e.message, "error"); return; }
                if (r.usuarios > 0) { await window._alertDialog(`"${esc(a.nombre)}" todavía tiene ${r.usuarios} miembro(s) asignados. Cámbialos de agrupación desde Miembros y vuelve a intentarlo.`, { titulo: "No se puede eliminar todavía" }); return; }
                const partes = [];
                if (r.piezas.size) partes.push(`${r.piezas.size} pieza(s) y ${r.parts.size} partitura(s)`);
                if (r.eventos.length) partes.push(`${r.eventos.length} evento(s) dirigido(s) a esta agrupación quedarán visibles solo para directores y administradores`);
                const aviso = `Vas a eliminar <strong>${esc(a.nombre)}</strong>.${partes.length ? " También se eliminará o afectará: " + partes.join("; ") + "." : ""} Esta acción no se puede deshacer.`;
                if (!(await window._confirmDialog(aviso, { titulo: "¿Eliminar agrupación?", peligroso: true, textoOk: "Sí, eliminar" }))) return;
                try { await eliminarAgrupacion({ ...a, estado: nucleo.estado }); window._showToast?.("Agrupación eliminada", "success"); }
                catch (e) { window._showToast?.("No se pudo eliminar: " + e.message, "error"); }
            }
            window.UI?.render?.();
        }
        if (window.Auth?.getSession()) iniciar(); else window.addEventListener("auth-ready", iniciar, { once: true });

    </script>
</body>
</html>
