<!DOCTYPE html>
<html lang="es-VE">
<head>
<script>if(localStorage.getItem("darkMode")==="true")document.documentElement.classList.add("dark-mode");</script>
<script>
  if (!sessionStorage.getItem("sistemaOrquestas_session") && !localStorage.getItem("sistemaOrquestas_session")) { window.location.href = "login.html"; }
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recurso – Sistema de Orquestas</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=22.0">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=22.0">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=22.0">
    <meta property="og:title" content="Recurso — Sistema de Orquestas">
    <meta property="og:description" content="Recurso de formación.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="icon-512.png">
    <link rel="stylesheet" href="estilos.css?v=22.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .detalle-cab { display: flex; gap: 1rem; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; width: 100%; }
        .detalle-meta { font-size: 0.88rem; color: var(--color-texto-claro); margin-top: 0.4rem; }
        .detalle-texto { background: var(--color-blanco); border: 1px solid var(--color-borde); border-radius: 22px; padding: 1.4rem 1.6rem; line-height: 1.7; width: 100%; box-sizing: border-box; box-shadow: var(--shadow-card); }
        .enlace-externo { display: flex; align-items: center; gap: 1rem; padding: 1.2rem 1.4rem; background: var(--color-blanco); border: 1px solid var(--color-borde); border-radius: 22px; box-shadow: var(--shadow-card); width: 100%; box-sizing: border-box; }
        .enlace-externo i.big { font-size: 2rem; color: var(--color-primario); }
        #visor-host { width: 100%; }
</style>
</head>
<body>
    <header class="barra-superior">
        <img src="datos.png" alt="Gobierno de Venezuela" style="max-height:50px;" />
        <nav id="user-nav" class="user-nav"></nav>
    </header>
    <div class="volver-barra"><a class="back-link" id="volver" href="formacion.html"><i class="fa-solid fa-arrow-left"></i> Volver a Formación</a></div>
    <main class="contenido-web container pagina-interior" id="detalle-main">
        <div class="detalle-cab">
            <div><span class="eyebrow" id="d-tipo">&nbsp;</span><h1 class="pagina-titulo" id="d-nombre">…</h1><p class="pagina-sub" id="d-desc"></p><p class="detalle-meta" id="d-meta"></p></div>
            <div class="btn-fila" id="d-acciones" style="display:none;">
                <button type="button" class="btn btn-cerrar btn-sm" id="d-editar"><i class="fa-solid fa-pen"></i> Editar</button>
                <button type="button" class="btn btn-cerrar btn-sm" id="d-eliminar"><i class="fa-solid fa-trash"></i> Eliminar</button>
            </div>
        </div>
        <div id="visor-host"></div>
        <div id="d-extra" style="width:100%;display:flex;flex-direction:column;gap:1rem;"></div>
    </main>
    <footer class="pie-pagina"><div class="footer-contenido"><p>© 2026 Fundación Musical Simón Bolívar</p></div></footer>

    <script src="check-entorno.js" defer></script>
    <script type="module" src="auth.js?v=22.0"></script>
    <script type="module" src="ui-manager.js?v=22.0"></script>
    <script type="module">

        import { db } from "./firebase-init.js";
        import { esc } from "./ui-componentes.js";
        import { abrirFormularioRecurso, eliminarRecurso, esPDF } from "./recursos-form.js";
        import { montarVisorPDF } from "./visor-pdf.js";
        import { collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        const $ = (id) => document.getElementById(id);
        const GESTORES = ["owner_supremo", "director_nacional", "director_regional", "director_nucleo", "admin"];
        const id = new URLSearchParams(location.search).get("id");

        function iniciar() {
            const session = window.Auth?.getSession();
            if (!session) { window.location.href = "index.html"; return; }
            const real = window.Auth.getRealSession() || session;
            if (!id) { window.location.href = "formacion.html"; return; }
            const puedeEditar = GESTORES.includes(session.role) && GESTORES.includes(real.role);
            let recurso = null, niveles = [], visor = null, urlMostrada = null;

            onSnapshot(collection(db, "formacion_niveles"), (s) => { niveles = s.docs.map((d) => d.data()).sort((a, b) => (a.orden ?? 99) - (b.orden ?? 99)).map((d) => d.nombre); }, () => {});
            onSnapshot(doc(db, "formacion_modulos", id), (s) => {
                if (!s.exists()) { $("detalle-main").innerHTML = `<div class="estado-vacio"><i class="fa-solid fa-circle-question"></i><h3>Este recurso ya no existe</h3><a class="btn btn-submit" href="formacion.html">Volver a Formación</a></div>`; visor?.destruir?.(); return; }
                recurso = { id: s.id, ...s.data() }; pintar();
            }, (e) => { console.error(e); window._showToast?.("No se pudo abrir el recurso", "error"); });

            function pintar() {
                const r = recurso; document.title = `${r.nombre} – Sistema de Orquestas`;
                $("d-tipo").textContent = r.tipo || "Recurso"; $("d-nombre").textContent = r.nombre; $("d-desc").textContent = r.descripcion || "";
                $("d-meta").innerHTML = `<i class="fa-solid fa-layer-group"></i> ${esc(r.nivel || "")}${r.autor ? ` · <i class="fa-solid fa-user-pen"></i> ${esc(r.autor)}` : ""}${r.fechaCreacion ? ` · ${esc(new Date(r.fechaCreacion).toLocaleDateString("es-VE"))}` : ""}`;
                $("d-acciones").style.display = puedeEditar ? "flex" : "none";
                const extra = $("d-extra"); extra.innerHTML = "";
                if (r.url && esPDF(r.url)) { if (urlMostrada !== r.url) { urlMostrada = r.url; visor?.destruir?.(); montarVisorPDF($("visor-host"), { url: r.url, nombre: r.nombre, nombreDescarga: r.nombre }).then((v) => (visor = v)); } }
                else { visor?.destruir?.(); visor = null; urlMostrada = null; $("visor-host").innerHTML = "";
                    if (r.url && /^https:\/\//i.test(r.url)) { let host = ""; try { host = new URL(r.url).hostname; } catch {} extra.innerHTML = `<div class="enlace-externo"><i class="fa-solid fa-arrow-up-right-from-square big"></i><div style="flex:1;min-width:0"><strong>Enlace externo</strong><br><small style="color:var(--color-texto-claro)">${esc(host)}</small></div><a class="btn btn-submit btn-sm" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Abrir</a></div>`; } }
                if (r.contenido) extra.insertAdjacentHTML("beforeend", `<div class="detalle-texto">${esc(r.contenido).replace(/\n/g, "<br>")}</div>`);
                if (!r.url && !r.contenido) extra.innerHTML = `<div class="estado-vacio"><i class="fa-solid fa-file"></i><h3>Este recurso todavía no tiene contenido</h3>${puedeEditar ? "<p>Usa “Editar” para subir un PDF o agregar texto.</p>" : ""}</div>`;
            }
            // Editar: el panel se abre ENCIMA del documento (no te saca de la página).
            $("d-editar").addEventListener("click", () => recurso && abrirFormularioRecurso({ recurso, niveles: niveles.length ? niveles : [recurso.nivel], sesion: real }));
            $("d-eliminar").addEventListener("click", async () => { if (recurso && (await eliminarRecurso(recurso))) setTimeout(() => (location.href = "formacion.html"), 500); });
            window.UI?.render?.();
        }
        if (window.Auth?.getSession()) iniciar(); else window.addEventListener("auth-ready", iniciar, { once: true });

    </script>
</body>
</html>
