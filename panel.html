    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel – Sistema de Orquestas</title>
    <link rel="stylesheet" href="estilos.css?v=9.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ---- Flyers: franja completa, pegada arriba, de punta a punta ---- */
        .flyers-bloque {
            background: linear-gradient(to bottom right, var(--color-primario-oscuro), var(--color-primario-claro));
            padding: 8px 0 12px;
        }
        .flyers-encabezado {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem 6px;
            display: flex;
            align-items: baseline;
            gap: 0.6rem;
            color: #fff;
        }
        .flyers-encabezado .nucleo-nombre { font-weight: 800; font-size: 1.1rem; }
        .flyers-encabezado .nucleo-estado { font-size: 0.85rem; opacity: 0.85; }
        #nucleo-selector {
            margin-left: auto;
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }
        .flyer-card {
            width: 200px;
            height: 130px;
            object-fit: cover;
            border-radius: var(--border-radius-sm);
            border: 2px solid transparent;
            box-shadow: var(--shadow-card);
            transition: var(--transition-normal);
        }
        .flyer-card:hover {
            border-color: #fff;
            box-shadow: var(--shadow-hover);
        }
        .carrusel-flyers {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
        }
        .flyers-viewport {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            justify-content: center;
            overflow: hidden;
            min-height: 130px;
        }
        .flyers-viewport:empty::after {
            content: "Sin flyers todavía para este núcleo";
            color: rgba(255,255,255,0.75);
            font-size: 0.9rem;
            align-self: center;
        }
        .flecha-btn {
            background: #0a0a0a;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 5px;
            transition: var(--transition-fast);
            flex-shrink: 0;
        }
        .flecha-btn:hover { filter: brightness(1.3); }

        /* ---- Calendario + accesos: pegados arriba, misma altura, sin huecos ---- */
        .dashboard-grid {
            display: grid;
            /* Aumentamos de 2.2fr a 2.4fr para que el calendario ocupe un poco más y empuje la derecha */
            grid-template-columns: 2.4fr 1fr; 
            /* Aumentamos el espacio vacío entre ambos de 16px a 32px */
            gap: 32px; 
            align-items: start;
            margin: 1rem 0 1.5rem;
        }
        .calendario-container {
            background: var(--color-blanco);
            border: 1px solid #e0e4f0;
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: visible;
            display: flex;
            flex-direction: column;
        }
        .calendario-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .calendario-header button {
            background: #0a0a0a;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .calendario-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }
        .dia-semana {
            font-weight: bold;
            color: var(--color-texto);
            padding: 6px 0;
            background: #f4f5f9;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .dia-numero {
            padding: 6px 0;
            border: 1px solid #e0e4f0;
            border-radius: 4px;
            min-height: 52px;
            cursor: pointer;
            transition: var(--transition-fast);
            font-size: 0.85rem;
            position: relative;
        }
        .dia-numero:hover { background: var(--color-primario); color: white; }
        .dia-numero.otro-mes { color: #ccc; }
        .evento {
            font-size: 0.65rem;
            padding: 1px 3px;
            border-radius: 4px;
            margin-top: 2px;
            display: block;
            cursor: pointer;
        }
        /* Botones de acceso: tamaño compacto normal, NO estirados a la altura
           del calendario (eso dejaba cajas enormes casi vacías). */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .dropdown-btn {
            padding: 16px 20px;
            background: var(--color-blanco);
            border: 1px solid #e0e4f0;
            border-radius: var(--border-radius);
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--color-texto);
            cursor: pointer;
            text-align: left;
            box-shadow: var(--shadow-card);
            transition: var(--transition-normal);
            text-decoration: none;
            display: block;
        }
        .dropdown-btn:hover { border-color: var(--color-primario); transform: translateY(-2px); }
        .form-control {
            width: 100%; padding: 0.55rem 0.7rem; margin-top: 0.3rem;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.95); color: var(--color-texto);
            font-size: 0.9rem; font-family: inherit;
        }
        .form-control:focus { outline: none; border-color: var(--color-primario); }
        .modal-content textarea.form-control { resize: vertical; }
        .editor-row label { font-weight: 700; color: rgba(255,255,255,0.9); font-size: 0.85rem; flex: 0 0 90px; }

        /* Selector de color con muestras (reemplaza el <input type="color"> nativo, feo y chico) */
        .color-swatches { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .color-swatch {
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            border: 3px solid transparent; transition: var(--transition-fast);
        }
        .color-swatch:hover { transform: scale(1.12); }
        .color-swatch.activo { border-color: #fff; box-shadow: 0 0 0 2px var(--color-primario); }
        #admin-controls { display: flex; gap: 10px; margin-top: 15px; }
        #event-group-row, #event-photo-row, #event-color-row { display: none; }
        #event-photo-preview {
            max-width: 100%;
            max-height: 150px;
            margin-top: 10px;
            display: none;
            border-radius: 8px;
        }
        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .flyers-encabezado { flex-wrap: wrap; }
            .flyer-card { width: 150px; height: 105px; }
        }
    </style>
</head>

    <script type="module" src="auth.js?v=10.0"></script>
    <script type="module" src="ui-manager.js?v=10.0"></script>
    <script type="module">
        import { db } from "./firebase-init.js";
        import { abrirSelectorUbicacion, cargarTodosLosNucleos } from "./ubicaciones.js";
        import { abrirEditorImagen } from "./gestor-imagenes.js";
        import { 
            collection, onSnapshot, getDocs, doc, writeBatch, addDoc, updateDoc, deleteDoc, query, where
        } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        // ====================== VARIABLES GLOBALES ======================
        const flyersCol = collection(db, "flyers");
        const eventosCol = collection(db, "eventos");
        let flyerData = [];
        let flyerStartIndex = 0;
        const MAX_VISIBLE = 4;
        let events = [];
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let eventPhotoUrl = "";

        // ====================== LÓGICA DE NÚCLEOS ======================
        // Roles que pueden VER y CAMBIAR entre núcleos (no están atados a uno solo)
        const ROLES_MULTI_NUCLEO = ["owner_supremo", "director_nacional", "director_regional"];
        const session = window.Auth?.getSession();
        // Núcleo que se está mostrando ahora mismo en pantalla
        let nucleoActivo = ROLES_MULTI_NUCLEO.includes(session?.role) ? "" : (session?.nucleus || "");
        let unsubFlyers = null, unsubEventos = null;

        function esMultiNucleo() {
            return ROLES_MULTI_NUCLEO.includes(session?.role);
        }

        function actualizarEncabezadoNucleo() {
            document.getElementById("nucleo-nombre-label").textContent = nucleoActivo || "Sin núcleo asignado";
            document.getElementById("nucleo-estado-label").textContent = session?.state ? `· ${session.state}` : "";
        }

        // Para roles que ven varios núcleos: arma un selector con los núcleos que
        // existan de verdad (usa el módulo compartido ubicaciones.js).
        async function cargarSelectorNucleos({ forzar = false } = {}) {
            const selector = document.getElementById("nucleo-selector");
            const btnGestionar = document.getElementById("btn-gestionar-nucleos");
            const btnReintentar = document.getElementById("btn-reintentar-nucleos");
            btnReintentar.style.display = "none";
            if (!esMultiNucleo()) { selector.style.display = "none"; btnGestionar.style.display = "none"; return; }
            selector.style.display = "inline-block";
            btnGestionar.style.display = "inline-block";
            try {
                const lista = await cargarTodosLosNucleos({ forzar });
                selector.innerHTML = lista.length
                    ? lista.map(n => `<option value="${n.nombre}">${n.nombre} (${n.estado})</option>`).join("")
                    : `<option value="">(sin núcleos todavía — usá "⚙️ Núcleos" para crear uno)</option>`;
                if (!nucleoActivo && lista.length) nucleoActivo = lista[0].nombre;
                selector.value = nucleoActivo || (lista.length ? lista[0].nombre : "");
            } catch (err) {
                console.error("No se pudo cargar la lista de núcleos:", err);
                selector.innerHTML = `<option value="">⚠️ Error al cargar — tocá "🔄 Reintentar"</option>`;
                window._showToast?.("No se pudieron cargar los núcleos. Revisá tu conexión.", "error");
                btnReintentar.style.display = "inline-block";
                btnReintentar.onclick = () => cargarSelectorNucleos({ forzar: true });
            }
            selector.onchange = () => { nucleoActivo = selector.value; cambiarNucleoActivo(); };
            btnGestionar.onclick = () => {
                abrirSelectorUbicacion({
                    nucleoInicial: nucleoActivo,
                    onConfirmar: async ({ nucleo }) => {
                        nucleoActivo = nucleo;
                        await cargarSelectorNucleos({ forzar: true });
                        cambiarNucleoActivo();
                    },
                });
            };
        }

        // Vuelve a suscribirse a flyers/eventos filtrados por el núcleo activo.
        // Se llama al cargar la página y cada vez que un director cambia de núcleo
        // en el selector — reactivo, sin recargar la página.
        function cambiarNucleoActivo() {
            actualizarEncabezadoNucleo();
            if (unsubFlyers) unsubFlyers();
            if (unsubEventos) unsubEventos();

            if (!nucleoActivo) {
                flyerData = []; renderFlyers();
                events = []; renderCalendar();
                return;
            }

            const flyersQuery = query(flyersCol, where("nucleo", "==", nucleoActivo));
            unsubFlyers = onSnapshot(flyersQuery, (snapshot) => {
                flyerData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                flyerData.sort((a, b) => (a.orden || 0) - (b.orden || 0));
                if (flyerStartIndex >= flyerData.length) flyerStartIndex = 0;
                renderFlyers();
            }, (err) => {
                console.error("No se pudieron leer los flyers de este núcleo:", err);
                window._showToast?.("No se pudieron cargar los flyers (revisá permisos/consola)", "error");
            });

            const eventosQuery = query(eventosCol, where("nucleo", "==", nucleoActivo));
            unsubEventos = onSnapshot(eventosQuery, (snapshot) => {
                events = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderCalendar();
            }, (err) => {
                console.error("No se pudieron leer los eventos de este núcleo:", err);
                window._showToast?.("No se pudieron cargar los eventos (revisá permisos/consola)", "error");
            });
        }

        // ====================== FLYERS (galería con miniaturas, igual que el Carrusel Nacional) ======================
        function renderFlyers() {
            const container = document.getElementById("flyers-viewport");
            const visible = flyerData.slice(flyerStartIndex, flyerStartIndex + MAX_VISIBLE);
            container.innerHTML = visible.map(f => `<img class="flyer-card" src="${f.url}" alt="${window._escapeHtml(f.alt)}" title="${window._escapeHtml(f.text)}" />`).join("");
        }
        // La suscripción real (con filtro por núcleo) la arma cambiarNucleoActivo(),
        // más abajo en la inicialización — así cambia en vivo si el usuario elige otro núcleo.

        document.getElementById("prev-flyer").addEventListener("click", () => {
            if (flyerData.length <= MAX_VISIBLE) return;
            flyerStartIndex = (flyerStartIndex - 1 + flyerData.length) % flyerData.length;
            renderFlyers();
        });
        document.getElementById("next-flyer").addEventListener("click", () => {
            if (flyerData.length <= MAX_VISIBLE) return;
            flyerStartIndex = (flyerStartIndex + 1) % flyerData.length;
            renderFlyers();
        });

        // Igual que el .flyer-card en pantalla (200x130 ≈ 20:13), para que lo
        // que se recorta en el editor coincida con lo que se ve después.
        const OPCIONES_EDITOR_FLYER = { carpeta: "flyers", aspecto: 20 / 13, ancho: 800, alto: 520 };
        // AGREGADO 2026-09-01: antes la foto de evento usaba un editor propio y
        // viejo (abrirCropModal) que guardaba la imagen recortada tal cual, a
        // su resolución ORIGINAL, como texto base64 directo en el documento
        // de Firestore — sin bajarle el tamaño. Firestore tiene un límite
        // duro de 1 MB por documento: una foto de celular normal, recortada,
        // ya en base64 supera ese límite fácilmente, así que guardar el
        // evento fallaba (o el documento quedaba corrupto/incompleto) apenas
        // alguien subía una foto de buena calidad. Ahora usa el mismo editor
        // que ya usan el Carrusel y los Flyers: reduce la imagen a un tamaño
        // fijo y la sube a Cloudinary, guardando solo la URL (unos 80
        // caracteres) en el documento.
        const OPCIONES_EDITOR_EVENTO = { carpeta: "eventos", aspecto: 16 / 9, ancho: 900, alto: 506 };

        let workingFlyers = [];
        let flyerSeleccionActual = 0;
        let flyerModalListo = false;

        function abrirFlyerModal() {
            if (!nucleoActivo) { window._showToast?.("Elegí un núcleo primero", "error"); return; }
            workingFlyers = flyerData.map(f => ({ ...f }));
            flyerSeleccionActual = 0;
            const modal = document.getElementById("flyer-modal");
            const fileInput = document.getElementById("flyer-file-input");

            function sync() {
                if (!workingFlyers[flyerSeleccionActual]) return;
                workingFlyers[flyerSeleccionActual].alt = document.getElementById("flyer-preview-alt").value;
                workingFlyers[flyerSeleccionActual].text = document.getElementById("flyer-preview-text").value;
            }

            function renderThumbs() {
                const strip = document.getElementById("flyer-thumb-strip");
                strip.innerHTML = "";
                workingFlyers.forEach((item, idx) => {
                    const t = document.createElement("div");
                    t.className = "thumb" + (idx === flyerSeleccionActual ? " selected" : "");
                    t.innerHTML = item.url ? `<img src="${item.url}" alt=""/>` : `<div class="thumb-vacio"><i class="fa-solid fa-image"></i></div>`;
                    t.addEventListener("click", () => { flyerSeleccionActual = idx; renderTodo(); });
                    strip.appendChild(t);
                });
                const addBtn = document.createElement("div");
                addBtn.className = "thumb thumb-add";
                addBtn.innerHTML = `<i class="fa-solid fa-plus"></i>`;
                addBtn.addEventListener("click", () => fileInput.click());
                strip.appendChild(addBtn);
            }

            function renderTodo() {
                const empty = document.getElementById("flyer-empty-state");
                const body = document.getElementById("flyer-editor-body");
                const strip = document.getElementById("flyer-thumb-strip");
                if (!workingFlyers.length) {
                    empty.style.display = "block"; body.style.display = "none";
                    strip.style.display = "none"; strip.innerHTML = "";
                    return;
                }
                empty.style.display = "none"; body.style.display = "block"; strip.style.display = "flex";
                if (flyerSeleccionActual >= workingFlyers.length) flyerSeleccionActual = workingFlyers.length - 1;
                const item = workingFlyers[flyerSeleccionActual];
                document.getElementById("flyer-preview-img").src = item.url || "";
                document.getElementById("flyer-preview-alt").value = item.alt || "";
                document.getElementById("flyer-preview-text").value = item.text || "";
                renderThumbs();
            }

            const agregarFlyer = (url) => {
                sync();
                workingFlyers.push({ url, alt: "", text: "" });
                flyerSeleccionActual = workingFlyers.length - 1;
                renderTodo();
            };

            if (!flyerModalListo) {
                flyerModalListo = true;
                fileInput.addEventListener("change", (e) => {
                    const file = e.target.files[0];
                    if (file) abrirEditorImagen(file, OPCIONES_EDITOR_FLYER, url => { if (url) agregarFlyer(url); });
                    e.target.value = "";
                });
                const empty = document.getElementById("flyer-empty-state");
                ["dragenter", "dragover", "dragleave", "drop"].forEach(ev =>
                    empty.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); })
                );
                empty.addEventListener("dragenter", () => empty.classList.add("active"));
                empty.addEventListener("dragleave", () => empty.classList.remove("active"));
                empty.addEventListener("drop", e => {
                    empty.classList.remove("active");
                    const files = e.dataTransfer.files;
                    if (files.length) abrirEditorImagen(files[0], OPCIONES_EDITOR_FLYER, url => { if (url) agregarFlyer(url); });
                });
                empty.addEventListener("click", () => fileInput.click());
                document.getElementById("flyer-preview-alt").addEventListener("input", sync);
                document.getElementById("flyer-preview-text").addEventListener("input", sync);
                document.getElementById("btn-editar-flyer").addEventListener("click", () => {
                    const item = workingFlyers[flyerSeleccionActual];
                    if (!item || !item.url) return;
                    fetch(item.url).then(r => r.blob()).then(blob => {
                        const file = new File([blob], "flyer.jpg", { type: blob.type || "image/jpeg" });
                        abrirEditorImagen(file, OPCIONES_EDITOR_FLYER, url => { if (url) { workingFlyers[flyerSeleccionActual].url = url; renderTodo(); } });
                    });
                });
                document.getElementById("btn-eliminar-flyer").addEventListener("click", () => {
                    workingFlyers.splice(flyerSeleccionActual, 1);
                    flyerSeleccionActual = Math.max(0, flyerSeleccionActual - 1);
                    renderTodo();
                });
                document.getElementById("close-flyer-modal").onclick = () => modal.style.display = "none";
                document.getElementById("flyer-close-btn").onclick = () => modal.style.display = "none";
            }

            const saveBtn = document.getElementById("save-flyers-btn");
            const saveBtnTextoOriginal = saveBtn.textContent;
            saveBtn.onclick = async () => {
                sync();
                saveBtn.disabled = true;
                saveBtn.textContent = "Guardando...";
                try {
                    await guardarFlyersEnFirestore(workingFlyers);
                    window._showToast?.("Flyers guardados correctamente", "success");
                    modal.style.display = "none";
                } catch (err) {
                    console.error("Error al guardar los flyers:", err);
                    window._showToast?.("No se pudieron guardar los flyers. Mirá la consola (F12) para más detalle.", "error");
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.textContent = saveBtnTextoOriginal;
                }
            };

            renderTodo();
            modal.style.display = "flex";
        }

        async function guardarFlyersEnFirestore(nuevosDatos) {
            if (!nucleoActivo) { window._showToast?.("Elegí un núcleo antes de guardar", "error"); return; }
            // Solo tocamos los flyers de ESTE núcleo — nunca los de otros.
            const snapshot = await getDocs(query(flyersCol, where("nucleo", "==", nucleoActivo)));
            const batch = writeBatch(db);
            snapshot.docs.forEach(d => batch.delete(doc(db, "flyers", d.id)));
            nuevosDatos.forEach((item, idx) => {
                const nuevoDoc = doc(flyersCol);
                batch.set(nuevoDoc, { url: item.url, alt: item.alt || "", text: item.text || "", orden: idx, nucleo: nucleoActivo });
            });
            await batch.commit();
        }

        document.getElementById("edit-flyers-btn").addEventListener("click", abrirFlyerModal);

        // ====================== CALENDARIO DE EVENTOS (Reactivo) ======================
        function renderCalendar() {
            const session = window.Auth?.getSession(); // uso seguro con window
            const grid = document.getElementById("calendario-grid");
            const title = document.getElementById("month-year");
            const months = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
            
            // Limpiar días anteriores
            grid.querySelectorAll(".dia-numero").forEach(d => d.remove());
            
            title.textContent = `${months[currentMonth]} ${currentYear}`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay() || 7;
            const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
            const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();

            let eventosVisibles;
            if (session && window.Auth?.checkPermission && window.Auth.checkPermission("manage_users")) {
                eventosVisibles = events;
            } else {
                // Filtrar eventos según el grupo/rol del usuario
                const rolNormalizado = session?.role === "estudiante" ? ["Estudiantes", "Estudiante"] :
                                     session?.role === "profesor" ? ["Profesores", "Profesor"] :
                                     [session?.role];
                const grupoNormalizado = session?.group ? [session.group] : [];
                eventosVisibles = events.filter(ev => {
                    const grupos = ev.groups;
                    return grupos.some(g => g === "todos" || rolNormalizado.includes(g) || grupoNormalizado.includes(g));
                });
            }

            let html = "";
            for (let i = firstDay-1; i > 0; i--) {
                html += `<div class="dia-numero otro-mes">${daysInPrevMonth - i + 1}</div>`;
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dayEvents = eventosVisibles.filter(ev => ev.date === dateStr);
                let eventoHtml = dayEvents.map(ev => {
                    let icon = ev.photo?.trim() ? `<img src="${ev.photo}" style="width:16px;height:16px;border-radius:50%;vertical-align:middle;" />` :
                        ({"todos":"👥","Profesores":"👩‍🏫","Estudiantes":"👦","Orquesta Infantil":"🎻","Orquesta Juvenil":"🎺"}[ev.groups[0]] || "👥");
                    return `<span class="evento" style="background:${ev.color}" data-eventid="${ev.id}">${icon} ${ev.title}</span>`;
                }).join("");
                html += `<div class="dia-numero" data-date="${dateStr}">${d}${eventoHtml}</div>`;
            }
            const totalCells = firstDay-1 + daysInMonth;
            const nextDays = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let i = 1; i <= nextDays; i++) {
                html += `<div class="dia-numero otro-mes">${i}</div>`;
            }
            grid.innerHTML += html;
        }
        // La suscripción real (con filtro por núcleo) la arma cambiarNucleoActivo().

        // Modal de evento
        document.getElementById("calendario-grid").addEventListener("click", (e) => {
            const eventoEl = e.target.closest(".evento");
            if (eventoEl) {
                const eventId = eventoEl.dataset.eventid;
                const esAdmin = window.Auth?.checkPermission && window.Auth.checkPermission("manage_users");
                abrirModalEvento(eventId, esAdmin);
            }
        });

        function abrirNuevoEvento() {
            if (!nucleoActivo) { window._showToast?.("Elegí un núcleo primero", "error"); return; }
            abrirModalEvento(null, true);
        }

        document.querySelectorAll("#event-color-swatches .color-swatch").forEach(sw => {
            sw.addEventListener("click", () => {
                document.getElementById("event-color").value = sw.dataset.color;
                document.querySelectorAll("#event-color-swatches .color-swatch").forEach(s => s.classList.remove("activo"));
                sw.classList.add("activo");
            });
        });

        // Trae las agrupaciones REALES del núcleo activo (las mismas que se
        // crean en Piezas) para poder marcar un evento visible solo para
        // "Orquesta Juvenil" o la que sea, en vez de una lista fija inventada.
        async function cargarAgrupacionesEnSelectorEvento() {
            const select = document.getElementById("event-group");
            // Quitamos las agrupaciones cargadas antes (dejamos las 3 fijas: todos/profesores/estudiantes)
            [...select.querySelectorAll("option[data-agrupacion]")].forEach(o => o.remove());
            if (!nucleoActivo) return;
            try {
                const snap = await getDocs(query(collection(db, "agrupaciones"), where("nucleo", "==", nucleoActivo)));
                snap.docs.forEach(d => {
                    const opt = document.createElement("option");
                    opt.value = d.data().nombre;
                    opt.textContent = d.data().nombre;
                    opt.dataset.agrupacion = "1";
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error("No se pudieron cargar las agrupaciones para el evento:", err);
            }
        }

        async function abrirModalEvento(eventId, esEdicion) {
            const esAdmin = window.Auth?.checkPermission && window.Auth.checkPermission("manage_users");
            const ev = eventId ? events.find(e => String(e.id) === String(eventId)) : null;

            document.getElementById("event-id").value = eventId || "";
            document.getElementById("event-date").value = ev ? ev.date : "";
            document.getElementById("event-title").value = ev ? ev.title : "";
            document.getElementById("event-time").value = ev ? (ev.time || "") : "";
            document.getElementById("event-location").value = ev ? (ev.location || "") : "";
            document.getElementById("event-photo").value = ev ? (ev.photo || "") : "";
            document.getElementById("event-desc").value = ev ? (ev.desc || "") : "";
            document.getElementById("event-color").value = ev ? (ev.color || "#ffeaa7") : "#ffeaa7";
            document.querySelectorAll("#event-color-swatches .color-swatch").forEach(sw => {
                sw.classList.toggle("activo", sw.dataset.color === document.getElementById("event-color").value);
            });
            document.getElementById("event-photo-file").value = "";
            eventPhotoUrl = ev ? (ev.photo || "") : "";

            const photoRow = document.getElementById("event-photo-row");
            const colorRow = document.getElementById("event-color-row");
            const groupRow = document.getElementById("event-group-row");
            const preview = document.getElementById("event-photo-preview");

            if (esAdmin && esEdicion) {
                photoRow.style.display = "flex";
                colorRow.style.display = "flex";
                groupRow.style.display = "flex";
            } else {
                photoRow.style.display = "none";
                colorRow.style.display = "none";
                groupRow.style.display = "none";
            }
            if (ev?.photo?.trim()) {
                preview.src = ev.photo;
                preview.style.display = "block";
            } else {
                preview.style.display = "none";
            }

            if (esAdmin && esEdicion) {
                await cargarAgrupacionesEnSelectorEvento();
                const groupSelect = document.getElementById("event-group");
                [...groupSelect.options].forEach(opt => opt.selected = ev ? ev.groups.includes(opt.value) : false);
            }

            const campos = document.querySelectorAll("#event-modal .form-control");
            const fileInput = document.getElementById("event-photo-file");
            campos.forEach(c => c.disabled = !(esAdmin && esEdicion));
            if (fileInput) fileInput.disabled = !(esAdmin && esEdicion);
            
            document.getElementById("admin-controls").style.display = (esAdmin && esEdicion) ? "flex" : "none";
            document.getElementById("event-modal-title").textContent = ev ? (esAdmin && esEdicion ? "Editar Evento" : "Detalles del Evento") : "Agregar Evento";
            document.getElementById("event-modal").style.display = "flex";
        }

        document.getElementById("event-photo-file").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (!file) return;
            abrirEditorImagen(file, OPCIONES_EDITOR_EVENTO, (url) => {
                if (url) {
                    document.getElementById("event-photo").value = url;
                    eventPhotoUrl = url;
                    document.getElementById("event-photo-preview").src = url;
                    document.getElementById("event-photo-preview").style.display = "block";
                }
                e.target.value = "";
            });
        });

        document.getElementById("save-event-btn").addEventListener("click", async () => {
            if (!window.Auth?.checkPermission || !window.Auth.checkPermission("manage_users")) return;
            const id = document.getElementById("event-id").value;
            if (!nucleoActivo) { window._showToast?.("Elegí un núcleo antes de guardar", "error"); return; }
            const evento = {
                date: document.getElementById("event-date").value,
                title: document.getElementById("event-title").value,
                time: document.getElementById("event-time").value,
                location: document.getElementById("event-location").value,
                photo: eventPhotoUrl || document.getElementById("event-photo").value,
                desc: document.getElementById("event-desc").value,
                color: document.getElementById("event-color").value,
                groups: [...document.getElementById("event-group").selectedOptions].map(o => o.value),
                nucleo: nucleoActivo
            };
            if (!evento.date || !evento.title) { alert("Fecha y título son obligatorios."); return; }
            try {
                if (id) {
                    await updateDoc(doc(eventosCol, id), evento);
                } else {
                    await addDoc(eventosCol, evento);
                }
                document.getElementById("event-modal").style.display = "none";
            } catch (err) { alert("Error: " + err.message); }
        });

        document.getElementById("delete-event-btn").addEventListener("click", async () => {
            if (!window.Auth?.checkPermission || !window.Auth.checkPermission("manage_users")) return;
            const id = document.getElementById("event-id").value;
            if (!id) return;
            if (confirm("¿Eliminar evento?")) {
                try {
                    await deleteDoc(doc(eventosCol, id));
                    document.getElementById("event-modal").style.display = "none";
                } catch (err) { alert("Error: " + err.message); }
            }
        });

        document.getElementById("close-event-modal").addEventListener("click", () => document.getElementById("event-modal").style.display = "none");
        document.getElementById("event-close-btn").addEventListener("click", () => document.getElementById("event-modal").style.display = "none");

        document.getElementById("prev-month").addEventListener("click", () => {
            if (currentMonth === 0) { currentMonth = 11; currentYear--; }
            else currentMonth--;
            renderCalendar();
        });
        document.getElementById("next-month").addEventListener("click", () => {
            if (currentMonth === 11) { currentMonth = 0; currentYear++; }
            else currentMonth++;
            renderCalendar();
        });

        document.getElementById("edit-calendar-btn").addEventListener("click", abrirNuevoEvento);

        // ====================== MIGRACIÓN DE DATOS ANTIGUOS (localStorage → Firestore) ======================
        (async function migrar() {
            try {
                // Migrar flyers
                const oldFlyers = localStorage.getItem("sistemaOrquestas_flyers");
                if (oldFlyers) {
                    const flyersArray = JSON.parse(oldFlyers);
                    const snap = await getDocs(flyersCol);
                    if (snap.empty) {
                        const batch = writeBatch(db);
                        flyersArray.forEach((f, i) => {
                            const newDoc = doc(flyersCol);
                            batch.set(newDoc, { url: f.src || "", alt: f.alt || "", text: f.text || "", orden: i });
                        });
                        await batch.commit();
                    }
                    localStorage.removeItem("sistemaOrquestas_flyers");
                }

                // Migrar eventos
                const oldEvents = localStorage.getItem("sistemaOrquestas_events");
                if (oldEvents) {
                    const eventsArray = JSON.parse(oldEvents);
                    const snap = await getDocs(eventosCol);
                    if (snap.empty) {
                        const batch = writeBatch(db);
                        eventsArray.forEach(ev => {
                            const newDoc = doc(eventosCol);
                            batch.set(newDoc, ev); // preserva la estructura antigua
                        });
                        await batch.commit();
                    }
                    localStorage.removeItem("sistemaOrquestas_events");
                }
            } catch (error) { console.warn("Migración omitida:", error); }
        })();

        // ====================== INICIALIZACIÓN FINAL (corrección de carrera) ======================
        if (window.UI?.render) {
            window.UI.render();
        }

        // Pinta el calendario YA (con lo que haya, aunque sea vacío) para que
        // nunca se quede "incompleto" esperando a que Firestore responda.
        renderCalendar();
        actualizarEncabezadoNucleo();
        (async () => {
            await cargarSelectorNucleos();
            actualizarEncabezadoNucleo();
            cambiarNucleoActivo();
        })();

        setTimeout(() => {
            // Mismo permiso que realmente usan los botones de guardar (manage_users),
            // así no aparece un botón que después no deja hacer nada.
            if (window.Auth?.checkPermission && window.Auth.checkPermission("manage_users")) {
                const btnFlyers = document.getElementById("edit-flyers-btn");
                const btnCalendar = document.getElementById("edit-calendar-btn");
                if (btnFlyers) btnFlyers.style.display = "block";
                if (btnCalendar) btnCalendar.style.display = "block";
            }
        }, 0);
    </script>
</body>
</html>
