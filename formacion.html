<!DOCTYPE html>
<html lang="es-VE">
<head>
<script>if(localStorage.getItem("darkMode")==="true")document.documentElement.classList.add("dark-mode");</script>
<script>
  if (!sessionStorage.getItem("sistemaOrquestas_session") && !localStorage.getItem("sistemaOrquestas_session")) { window.location.href = "login.html"; }
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formación – Sistema de Orquestas</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=22.0">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=22.0">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=22.0">
    <meta property="og:title" content="Formación — Sistema de Orquestas">
    <meta property="og:description" content="Material de estudio por niveles y tutor musical.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="icon-512.png">
    <link rel="stylesheet" href="estilos.css?v=22.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .formacion-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; width: 100%; align-items: start; }
        .formacion-barra { display: flex; align-items: flex-end; gap: 0.8rem; width: 100%; }
        .btn-tuerca { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--negro); color: #fff; cursor: pointer; flex-shrink: 0; margin-bottom: 4px; display: none; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(0,0,0,.28); transition: transform .4s ease, filter .2s; }
        .btn-tuerca:hover { transform: rotate(60deg); filter: brightness(1.3); }
        .recurso-portada { height: 150px; }
        .recurso-portada .emoji { font-size: 2.8rem; position: relative; z-index: 1; }
        .recurso-desc { font-size: 0.85rem; color: var(--color-texto-claro); margin: 0.2rem 0 0.5rem; }
        .formacion-chat-col { position: sticky; top: 90px; }
        .chat-ia-seccion-titulo { font-weight: 800; color: var(--color-primario); margin-bottom: 0.6rem; }
        html.dark-mode .chat-ia-seccion-titulo { color: #d6d3ff; }
        .chat-ia-embebido { height: 480px; }
        .fila-nivel { display: grid; grid-template-columns: auto 1fr auto auto; gap: 0.5rem; align-items: center; background: rgba(255,255,255,.1); border-radius: 16px; padding: 0.55rem 0.6rem; margin-bottom: 0.55rem; }
        .fila-nivel .orden { display: flex; flex-direction: column; gap: 2px; }
        .fila-nivel .orden button, .fila-nivel .quitar { width: 28px; height: 22px; border: none; border-radius: 8px; background: rgba(255,255,255,.2); color: #fff; cursor: pointer; font-size: .7rem; }
        .fila-nivel .orden button:disabled { opacity: .3; cursor: default; }
        .fila-nivel .quitar { width: 34px; height: 34px; border-radius: 50%; background: var(--negro); font-size: .85rem; }
        .fila-nivel .cnt { font-size: .75rem; opacity: .85; white-space: nowrap; }
        .fila-nivel.nuevo { outline: 2px dashed rgba(255,255,255,.5); }
        .fila-nivel.borrado { display: none; }
        @media (max-width: 980px) { .formacion-layout { grid-template-columns: 1fr; } .formacion-chat-col { position: static; } .chat-ia-embebido { height: 420px; } }
</style>
</head>
<body>
    <header class="barra-superior">
        <img src="datos.png" alt="Gobierno de Venezuela" style="max-height:50px;" />
        <nav id="user-nav" class="user-nav"></nav>
    </header>
    <div class="volver-barra"><a class="back-link" id="volver" href="panel.html"><i class="fa-solid fa-arrow-left"></i> Volver al panel</a></div>
    <main class="contenido-web container pagina-interior" id="formacion-container">
        <div class="pagina-cab">
            <div><h1 class="pagina-titulo">Formación</h1><p class="pagina-sub">Métodos, correcciones y recursos organizados por nivel.</p></div>
            <button type="button" class="btn btn-submit" id="btn-nuevo-recurso" style="display:none;"><i class="fa-solid fa-plus"></i> Agregar recurso</button>
        </div>
        <div class="formacion-layout">
            <div class="formacion-principal">
                <div class="formacion-barra">
                    <div class="tabs-linea" id="niveles-tabs" role="tablist" aria-label="Niveles"><span class="tabs-indicador" id="tab-ind"></span></div>
                    <button type="button" class="btn-tuerca" id="btn-niveles" title="Administrar niveles" aria-label="Administrar niveles"><i class="fa-solid fa-gear"></i></button>
                </div>
                <div class="grid-tarjetas" id="grid-recursos" style="margin-top:1.4rem;" aria-live="polite"></div>
            </div>
            <aside class="formacion-chat-col">
                <div class="chat-ia-seccion-titulo"><i class="fa-solid fa-comments"></i> Tutor Musical</div>
                <div class="chat-ia-embebido" id="chat-ia-embebido"></div>
            </aside>
        </div>
    </main>
    <footer class="pie-pagina"><div class="footer-contenido"><p>© 2026 Fundación Musical Simón Bolívar</p></div></footer>

    <script src="check-entorno.js" defer></script>
    <script type="module" src="auth.js?v=22.0"></script>
    <script type="module" src="ui-manager.js?v=22.0"></script>
    <script type="module">

        import { db } from "./firebase-init.js";
        import { abrirPanel, menuContextual, esc } from "./ui-componentes.js";
        import { abrirFormularioRecurso, eliminarRecurso, esPDF, ICONO_POR_TIPO } from "./recursos-form.js";
        import { aplicarEnLotes } from "./agrupaciones.js";
        import { dibujarMiniaturaPDF } from "./visor-pdf.js";
        import { montarChatEmbebido } from "./chat-widget.js";
        import { collection, onSnapshot, addDoc, doc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        const $ = (id) => document.getElementById(id);
        const GESTORES = ["owner_supremo", "director_nacional", "director_regional", "director_nucleo", "admin"];

        function iniciar() {
            const session = window.Auth?.getSession();
            if (!session) { window.location.href = "index.html"; return; }
            const real = window.Auth.getRealSession() || session;
            const puedeEditar = GESTORES.includes(session.role) && GESTORES.includes(real.role);
            let recursos = [], docsNiveles = [], cargadoR = false, cargadoN = false, nivelActivo = sessionStorage.getItem("formacion_nivel") || "", minis = new Map();
            try { montarChatEmbebido($("chat-ia-embebido")); } catch (e) { console.error("Tutor:", e); }
            $("btn-nuevo-recurso").style.display = puedeEditar ? "inline-flex" : "none";
            $("btn-niveles").style.display = puedeEditar ? "inline-flex" : "none";

            onSnapshot(collection(db, "formacion_modulos"), (s) => { recursos = s.docs.map((d) => ({ id: d.id, ...d.data() })); cargadoR = true; migrar(); pintar(); }, (e) => { cargadoR = true; console.error(e); window._showToast?.("No se pudieron cargar los recursos", "error"); pintar(); });
            onSnapshot(collection(db, "formacion_niveles"), (s) => { docsNiveles = s.docs.map((d) => ({ id: d.id, ...d.data() })); cargadoN = true; migrar(); pintar(); }, (e) => { cargadoN = true; console.error(e); pintar(); });

            // Niveles = documentos de formacion_niveles + (migración) niveles que solo existían como texto en los recursos.
            const yaCreados = new Set();   // evita crear dos veces el mismo nivel mientras llega la actualización de la base
            async function migrar() {
                if (!puedeEditar || !cargadoR || !cargadoN) return;
                const faltan = [...new Set(recursos.map((r) => r.nivel).filter(Boolean))].filter((n) => !yaCreados.has(n) && !docsNiveles.some((d) => d.nombre === n));
                if (!faltan.length) return;
                faltan.forEach((n) => yaCreados.add(n));
                try { let o = docsNiveles.reduce((m, d) => Math.max(m, d.orden ?? 0), -1) + 1; for (const n of faltan.sort()) await addDoc(collection(db, "formacion_niveles"), { nombre: n, orden: o++ }); }
                catch (e) { faltan.forEach((n) => yaCreados.delete(n)); console.warn("No se pudieron registrar los niveles existentes:", e); }
            }
            const niveles = () => {
                const base = [...new Set([...docsNiveles].sort((a, b) => (a.orden ?? 99) - (b.orden ?? 99) || a.nombre.localeCompare(b.nombre)).map((d) => d.nombre))];
                const extra = [...new Set(recursos.map((r) => r.nivel).filter(Boolean))].filter((n) => !base.includes(n)).sort();
                const todos = [...base, ...extra];
                return puedeEditar ? todos : todos.filter((n) => recursos.some((r) => r.nivel === n));
            };

            function pintarTabs(ns) {
                const cont = $("niveles-tabs"), ind = $("tab-ind");
                cont.querySelectorAll(".tab").forEach((b) => b.remove());
                ns.forEach((n) => { const b = document.createElement("button"); b.type = "button"; b.className = "tab" + (n === nivelActivo ? " activo" : ""); b.setAttribute("role", "tab"); b.setAttribute("aria-selected", n === nivelActivo); b.dataset.nivel = n;
                    b.innerHTML = `${esc(n)} <span class="n">${recursos.filter((r) => r.nivel === n).length}</span>`; cont.insertBefore(b, ind); });
                requestAnimationFrame(() => { const a = cont.querySelector(".tab.activo"); if (a) { ind.style.width = a.offsetWidth + "px"; ind.style.transform = `translateX(${a.offsetLeft}px)`; } else ind.style.width = "0"; });
            }
            function pintar() {
                const grid = $("grid-recursos"), ns = niveles();
                if (!cargadoR || !cargadoN) { grid.innerHTML = Array.from({ length: 3 }, () => `<div class="skeleton" style="height:250px;border-radius:22px;"></div>`).join(""); return; }
                if (!ns.includes(nivelActivo)) nivelActivo = ns[0] || "";
                pintarTabs(ns);
                if (!ns.length) { grid.innerHTML = `<div class="estado-vacio"><i class="fa-solid fa-graduation-cap"></i><h3>Todavía no hay niveles</h3><p>Los niveles organizan el material de estudio.</p>${puedeEditar ? `<button type="button" class="btn btn-submit" id="vacio-nivel"><i class="fa-solid fa-gear"></i> Crear niveles</button>` : ""}</div>`; $("vacio-nivel")?.addEventListener("click", abrirNiveles); return; }
                const items = recursos.filter((r) => r.nivel === nivelActivo).sort((a, b) => String(b.fechaCreacion || "").localeCompare(String(a.fechaCreacion || "")));
                if (!items.length) { grid.innerHTML = `<div class="estado-vacio"><i class="fa-solid fa-book-open"></i><h3>Este nivel todavía no tiene recursos</h3>${puedeEditar ? `<button type="button" class="btn btn-submit" id="vacio-recurso"><i class="fa-solid fa-plus"></i> Agregar el primero</button>` : "<p>Pronto habrá material disponible.</p>"}</div>`; $("vacio-recurso")?.addEventListener("click", () => nuevoRecurso()); return; }
                grid.innerHTML = items.map((r, i) => {
                    const mini = esPDF(r.url) ? minis.get(r.url) : null;
                    return `<article class="pin-card" style="animation-delay:${Math.min(i, 8) * 40}ms">
                        <a class="pin-enlace" href="recurso-detalle.html?id=${encodeURIComponent(r.id)}" aria-label="Abrir ${esc(r.nombre)}"></a>
                        <div class="pin-portada recurso-portada" data-mini="${esc(esPDF(r.url) ? r.url : "")}" ${mini ? `style="background:#fff url('${mini}') top center/cover"` : ""}>${mini ? "" : `<span class="emoji">${esc(r.icono || ICONO_POR_TIPO[r.tipo] || "📄")}</span>`}</div>
                        <div class="pin-body"><span class="eyebrow">${esc(r.tipo || "Recurso")}</span><h3>${esc(r.nombre)}</h3>
                            ${r.descripcion ? `<p class="recurso-desc">${esc(r.descripcion)}</p>` : ""}
                            <p class="pin-meta">${esc([r.autor, r.fechaCreacion ? new Date(r.fechaCreacion).toLocaleDateString("es-VE") : ""].filter(Boolean).join(" · "))}</p></div>
                        ${puedeEditar ? `<div class="card-acciones"><button type="button" class="btn-mas" data-menu="${esc(r.id)}" aria-label="Opciones de ${esc(r.nombre)}" aria-haspopup="menu"><i class="fa-solid fa-ellipsis"></i></button></div>` : ""}
                    </article>`;
                }).join("");
                grid.querySelectorAll(".recurso-portada[data-mini]").forEach((el) => { if (el.dataset.mini && !minis.has(el.dataset.mini)) obs.observe(el); });
            }
            const obs = new IntersectionObserver((es) => es.forEach(async (e) => {
                if (!e.isIntersecting) return; const el = e.target; obs.unobserve(el); const url = el.dataset.mini; if (!url || minis.has(url)) return;
                const c = document.createElement("canvas");
                if (await dibujarMiniaturaPDF(c, url, 320)) { const d = c.toDataURL("image/jpeg", 0.72); minis.set(url, d); if (el.isConnected) { el.style.background = `#fff url('${d}') top center/cover`; el.innerHTML = ""; } } else minis.set(url, null);
            }), { rootMargin: "200px" });
            const st = document.createElement("style"); st.textContent = ".pin-enlace{position:absolute;inset:0;z-index:1}.pin-card .card-acciones{z-index:3}"; document.head.appendChild(st);

            $("niveles-tabs").addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (!b) return; nivelActivo = b.dataset.nivel; sessionStorage.setItem("formacion_nivel", nivelActivo); pintar(); });
            window.addEventListener("resize", () => pintarTabs(niveles()));
            $("grid-recursos").addEventListener("click", (e) => {
                const b = e.target.closest("[data-menu]"); if (!b) return; const r = recursos.find((x) => x.id === b.dataset.menu); if (!r) return;
                menuContextual(b, [{ icono: "fa-pen", texto: "Editar", onClick: () => abrirFormularioRecurso({ recurso: r, niveles: niveles(), sesion: real, onGuardado: (n) => { nivelActivo = n; } }) },
                    { separador: true }, { icono: "fa-trash", texto: "Eliminar", peligro: true, onClick: () => eliminarRecurso(r) }]);
            });
            const nuevoRecurso = () => abrirFormularioRecurso({ niveles: niveles(), nivelInicial: nivelActivo, sesion: real, onGuardado: (n) => { nivelActivo = n; sessionStorage.setItem("formacion_nivel", n); } });
            $("btn-nuevo-recurso").addEventListener("click", () => { if (!niveles().length) { window._showToast?.("Primero crea un nivel con la tuerca ⚙.", "info"); abrirNiveles(); return; } nuevoRecurso(); });

            // ---------- UNA sola tuerca: administra TODOS los niveles ----------
            function abrirNiveles() {
                let filas = niveles().map((n) => ({ id: docsNiveles.find((d) => d.nombre === n)?.id || null, original: n, nombre: n, borrado: false }));
                const cnt = (nombreOriginal) => recursos.filter((r) => r.nivel === nombreOriginal).length;
                const p = abrirPanel({ titulo: "Administrar niveles", subtitulo: "Cambia el nombre, el orden, agrega o elimina niveles. Los cambios se aplican al guardar.", cuerpoHTML: `<div id="nv-lista"></div><button type="button" class="btn btn-cerrar btn-sm" id="nv-agregar" style="margin-top:.4rem"><i class="fa-solid fa-plus"></i> Agregar nivel</button><p class="error-campo" id="nv-err" role="alert"></p>`,
                    pieHTML: `<button type="button" class="btn btn-cerrar" id="nv-cancelar">Cancelar</button><button type="button" class="btn btn-submit" id="nv-guardar">Guardar cambios</button>` });
                const lista = p.panel.querySelector("#nv-lista"), err = p.panel.querySelector("#nv-err");
                function dibujar() {
                    const vivas = filas.filter((f) => !f.borrado);
                    lista.innerHTML = vivas.map((f, i) => `<div class="fila-nivel ${f.id ? "" : "nuevo"}" data-k="${filas.indexOf(f)}">
                        <div class="orden"><button type="button" data-mv="-1" ${i === 0 ? "disabled" : ""} aria-label="Subir"><i class="fa-solid fa-chevron-up"></i></button><button type="button" data-mv="1" ${i === vivas.length - 1 ? "disabled" : ""} aria-label="Bajar"><i class="fa-solid fa-chevron-down"></i></button></div>
                        <input type="text" maxlength="60" value="${esc(f.nombre)}" aria-label="Nombre del nivel" data-nom>
                        <span class="cnt">${f.id ? cnt(f.original) + " recurso(s)" : "nuevo"}</span>
                        <button type="button" class="quitar" data-del aria-label="Eliminar nivel"><i class="fa-solid fa-trash"></i></button></div>`).join("") || `<p class="ayuda">No hay niveles. Agrega el primero.</p>`;
                }
                dibujar();
                lista.addEventListener("input", (e) => { const inp = e.target.closest("[data-nom]"); if (inp) filas[Number(inp.closest(".fila-nivel").dataset.k)].nombre = inp.value; });
                lista.addEventListener("click", async (e) => {
                    const fila = e.target.closest(".fila-nivel"); if (!fila) return; const k = Number(fila.dataset.k), f = filas[k];
                    const mv = e.target.closest("[data-mv]");
                    if (mv) { const vivas = filas.filter((x) => !x.borrado), i = vivas.indexOf(f), j = i + Number(mv.dataset.mv); const g = vivas[j]; if (!g) return; const a = filas.indexOf(f), b = filas.indexOf(g); [filas[a], filas[b]] = [filas[b], filas[a]]; dibujar(); return; }
                    if (e.target.closest("[data-del]")) {
                        const n = f.id ? cnt(f.original) : 0;
                        if (n > 0 && !(await window._confirmDialog(`El nivel <strong>${esc(f.original)}</strong> tiene ${n} recurso(s). Si lo eliminas, <strong>también se eliminan sus recursos</strong>. ¿Seguro?`, { titulo: "¿Eliminar nivel y sus recursos?", peligroso: true, textoOk: "Sí, eliminar todo" }))) return;
                        f.borrado = true; dibujar();
                    }
                });
                p.panel.querySelector("#nv-agregar").addEventListener("click", () => { filas.push({ id: null, original: "", nombre: "", borrado: false }); dibujar(); lista.querySelector(".fila-nivel:last-child input")?.focus(); });
                p.panel.querySelector("#nv-cancelar").addEventListener("click", p.cerrar);
                p.panel.querySelector("#nv-guardar").addEventListener("click", async () => {
                    err.textContent = ""; const vivas = filas.filter((f) => !f.borrado).map((f) => ({ ...f, nombre: f.nombre.trim() }));
                    if (vivas.some((f) => !f.nombre)) { err.textContent = "Todos los niveles necesitan un nombre."; return; }
                    const vistos = new Set(); for (const f of vivas) { const k = f.nombre.toLowerCase(); if (vistos.has(k)) { err.textContent = `El nombre “${f.nombre}” está repetido.`; return; } vistos.add(k); }
                    const btn = p.panel.querySelector("#nv-guardar"); btn.disabled = true; btn.textContent = "Guardando…";
                    try {
                        const ops = [];
                        for (const f of filas.filter((x) => x.borrado && x.id)) { ops.push(["delete", doc(db, "formacion_niveles", f.id)]); recursos.filter((r) => r.nivel === f.original).forEach((r) => ops.push(["delete", doc(db, "formacion_modulos", r.id)])); }
                        for (let i = 0; i < vivas.length; i++) {
                            const f = vivas[i];
                            if (f.id) { ops.push(["update", doc(db, "formacion_niveles", f.id), { nombre: f.nombre, orden: i }]); if (f.nombre !== f.original) recursos.filter((r) => r.nivel === f.original).forEach((r) => ops.push(["update", doc(db, "formacion_modulos", r.id), { nivel: f.nombre }])); }
                        }
                        await aplicarEnLotes(ops);
                        for (let i = 0; i < vivas.length; i++) if (!vivas[i].id) await addDoc(collection(db, "formacion_niveles"), { nombre: vivas[i].nombre, orden: i });
                        const act = vivas.find((f) => f.original === nivelActivo); nivelActivo = act ? act.nombre : (vivas[0]?.nombre || "");
                        window._showToast?.("Niveles actualizados", "success"); p.cerrar();
                    } catch (e) { console.error(e); err.textContent = "No se pudo guardar: " + e.message; btn.disabled = false; btn.textContent = "Guardar cambios"; }
                });
            }
            $("btn-niveles").addEventListener("click", abrirNiveles);
            window.UI?.render?.();
        }
        if (window.Auth?.getSession()) iniciar(); else window.addEventListener("auth-ready", iniciar, { once: true });

    </script>
</body>
</html>
