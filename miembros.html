<script>
  if (!sessionStorage.getItem("sistemaOrquestas_session") && !localStorage.getItem("sistemaOrquestas_session")) { window.location.href = "login.html"; }
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=22.0">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=22.0">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=22.0">
    <meta property="og:title" content="Miembros — Sistema de Orquestas">
    <meta property="og:description" content="Directorio institucional de tu núcleo.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="icon-512.png">
    <link rel="stylesheet" href="estilos.css?v=22.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chips-roles { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; width: 100%; }
        .chips-roles .sep { width: 1px; height: 26px; background: var(--color-borde); margin: 0 0.3rem; }
        .chip .n { font-weight: 800; opacity: 0.7; margin-left: 0.15rem; }
        .miembro { padding: 1.1rem 1.1rem 1rem; display: flex; gap: 0.9rem; align-items: flex-start; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 1rem; letter-spacing: 0.02em; }
        .miembro-info { min-width: 0; flex: 1; }
        .miembro-info h3 { font-size: 1rem; font-weight: 800; margin: 0.1rem 0 0.15rem; overflow-wrap: anywhere; padding-right: 2rem; }
        .miembro-linea { font-size: 0.83rem; color: var(--color-texto-claro); margin: 0.12rem 0; overflow-wrap: anywhere; }
        .miembro-linea i { width: 1rem; text-align: center; margin-right: 0.15rem; color: var(--color-primario); opacity: 0.8; }
        html.dark-mode .miembro-linea i { color: #b9b4ff; }
        .miembro.inactivo { opacity: 0.6; }
        .miembro .etiqueta-inactivo { display: inline-block; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; background: var(--color-superficie-suave); color: var(--color-texto-claro); border-radius: 999px; padding: 0.15rem 0.6rem; margin-top: 0.3rem; }
        .modal-clave { max-width: 460px; text-align: center; }
        .modal-clave .clave-caja { margin: 1rem 0 0.4rem; }
        .modal-clave p { font-size: 0.9rem; opacity: 0.92; margin: 0.4rem 0; }
        .modal-clave .modal-acciones { justify-content: center; }
        .rol-chip-fijo { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0.9rem; border-radius: 999px; background: rgba(255, 255, 255, 0.14); font-size: 0.85rem; font-weight: 700; margin: 0 0.4rem 0.4rem 0; }
</style>
</head>
<body>
    <header class="barra-superior">
        <img src="datos.png" alt="Gobierno de Venezuela" style="max-height:50px;" />
        <nav id="user-nav" class="user-nav"></nav>
    </header>
    <div class="volver-barra"><a class="back-link" id="volver" href="panel.html"><i class="fa-solid fa-arrow-left"></i> Volver al panel</a></div>
    <main class="contenido-web container pagina-interior">
        <div class="pagina-cab">
            <div><h1 class="pagina-titulo">Miembros</h1><p class="pagina-sub" id="sub">&nbsp;</p></div>
            <button type="button" id="btn-nuevo" class="btn btn-submit" style="display:none;"><i class="fa-solid fa-plus"></i> Nuevo miembro</button>
        </div>
        <div class="barra-herramientas">
            <label class="buscador-caja buscador-grande" for="q"><i class="fa-solid fa-magnifying-glass"></i><input id="q" type="search" placeholder="Buscar por nombre, correo o instrumento…" autocomplete="off"></label>
            <select id="f-agr" aria-label="Filtrar por agrupación"><option value="">Todas las agrupaciones</option></select>
            <select id="f-inst" aria-label="Filtrar por instrumento"><option value="">Todos los instrumentos</option></select>
        </div>
        <div class="chips-roles" id="chips" role="tablist" aria-label="Rol"></div>
        <div class="grid-tarjetas" id="grid" aria-live="polite"></div>
        <label style="display:none;align-items:center;gap:.5rem;font-size:.85rem;color:var(--color-texto-claro);" id="lbl-inactivos"><input type="checkbox" id="ver-inactivos"> Mostrar cuentas desactivadas</label>
    </main>
    <footer class="pie-pagina"><div class="footer-contenido"><p>© 2026 Fundación Musical Simón Bolívar</p></div></footer>

    <script src="check-entorno.js" defer></script>
    <script type="module" src="auth.js?v=22.0"></script>
    <script type="module" src="ui-manager.js?v=22.0"></script>
    <script type="module">

        import { db } from "./firebase-init.js";
        import { backendAPI } from "./backend-api.js";
        import { conNucleoActivo } from "./nucleo-activo.js";
        import { cargarTodosLosNucleos, ESTADOS_VENEZUELA } from "./ubicaciones.js";
        import { abrirPanel, menuContextual, esc } from "./ui-componentes.js";
        import { opcionesInstrumentoHTML, enlazarSelectInstrumento } from "./instrumentos.js";
        import { collection, query, where, onSnapshot, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        const $ = (id) => document.getElementById(id);
        const NIVEL = { owner_supremo: 70, director_nacional: 60, director_regional: 50, director_nucleo: 40, admin: 30, profesor: 20, estudiante: 10 };
        const ROL = {
            owner_supremo: ["Owner Supremo", "Owner Supremo"], director_nacional: ["Director nacional", "Directores nacionales"], director_regional: ["Director regional", "Directores regionales"],
            director_nucleo: ["Director de núcleo", "Directores de núcleo"], admin: ["Administrador", "Administradores"], profesor: ["Profesor", "Profesores"], estudiante: ["Estudiante", "Estudiantes"],
        };
        const norm = (t) => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
        const iniciales = (n) => (String(n).trim().split(/\s+/).slice(0, 2).map((x) => x[0] || "").join("") || "?").toUpperCase();
        const colorAvatar = (n) => { let h = 0; for (const c of String(n)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${235 + (h % 40)}, ${48 + (h % 20)}%, ${34 + (h % 14)}%)`; };
        function desde(iso) { const d = new Date(iso); return iso && !isNaN(d) ? d.toLocaleDateString("es-VE", { day: "numeric", month: "numeric", year: "numeric" }) : "—"; }

        function iniciar() {
            const session = window.Auth?.getSession();
            if (!session) { window.location.href = "index.html"; return; }
            const real = window.Auth.getRealSession() || session;
            const miNivel = NIVEL[real.role] ?? 0, nivelVista = NIVEL[session.role] ?? 0;
            const esMulti = ["owner_supremo", "director_nacional", "director_regional"].includes(session.role);
            const gestiona = nivelVista >= 30 && miNivel >= 30;
            const verCorreo = gestiona;
            let nucleo = null, miembros = [], cargado = false, unsub = null, rolActivo = "todos", superior = new Map(), agrupaciones = [], unsubAgr = null;

            // ---- qué roles puede ver este usuario ----
            const rolesNucleo = ["estudiante", "profesor", "admin", "director_nucleo"];
            const rolesSuperiores = [];
            if (nivelVista >= 40) rolesSuperiores.push("director_regional");
            if (nivelVista >= 50) rolesSuperiores.push("director_nacional");
            if (nivelVista >= 60) rolesSuperiores.push("owner_supremo");
            const permitidosCrear = Object.keys(NIVEL).filter((r) => (miNivel >= 70 ? r !== "owner_supremo" : NIVEL[r] < miNivel));

            conNucleoActivo((n) => { nucleo = n; suscribir(); });

            function restricciones() {
                const c = [where("nucleo", "==", nucleo.nombre)];
                if (nucleo.estado && (esMulti || real.role === "director_regional")) c.push(where("estado", "==", nucleo.estado));
                return c;
            }
            function suscribir() {
                unsub?.(); unsubAgr?.(); miembros = []; cargado = false; agrupaciones = []; superior = new Map();
                $("sub").innerHTML = nucleo ? `<i class="fa-solid fa-location-dot"></i> ${esc(nucleo.nombre)}${nucleo.estado ? " · " + esc(nucleo.estado) : ""}` : "&nbsp;";
                $("btn-nuevo").style.display = gestiona && permitidosCrear.length ? "inline-flex" : "none";
                $("lbl-inactivos").style.display = gestiona ? "inline-flex" : "none";
                if (!nucleo) { cargado = true; pintar(); return; }
                pintar();
                unsub = onSnapshot(query(collection(db, "usuarios"), ...restricciones()), (s) => { miembros = s.docs.map((d) => ({ uid: d.id, ...d.data() })); cargado = true; pintar(); },
                    (e) => { cargado = true; console.error(e); window._showToast?.("No se pudieron cargar los miembros (permisos)", "error"); pintar(); });
                unsubAgr = onSnapshot(query(collection(db, "agrupaciones"), where("nucleo", "==", nucleo.nombre)), (s) => { agrupaciones = s.docs.map((d) => d.data().nombre).filter(Boolean).sort((a, b) => a.localeCompare(b)); llenarFiltros(); }, () => {});
            }
            function llenarFiltros() {
                const a = $("f-agr"), i = $("f-inst"), va = a.value, vi = i.value;
                const agrs = [...new Set([...agrupaciones, ...miembros.map((m) => m.agrupacion).filter(Boolean)])].sort((x, y) => x.localeCompare(y));
                const ins = [...new Set(miembros.map((m) => m.instrumento).filter(Boolean))].sort((x, y) => x.localeCompare(y));
                a.innerHTML = `<option value="">Todas las agrupaciones</option>` + agrs.map((x) => `<option ${x === va ? "selected" : ""} value="${esc(x)}">${esc(x)}</option>`).join("");
                i.innerHTML = `<option value="">Todos los instrumentos</option>` + ins.map((x) => `<option ${x === vi ? "selected" : ""} value="${esc(x)}">${esc(x)}</option>`).join("");
            }

            async function cargarSuperior(rol) {
                if (superior.has(rol)) return; superior.set(rol, null); pintar();
                const c = [where("rango", "==", rol)];
                if (rol === "director_regional" && !["owner_supremo", "director_nacional"].includes(session.role)) c.push(where("estado", "==", session.state || "__"));
                try { const s = await getDocs(query(collection(db, "usuarios"), ...c)); superior.set(rol, s.docs.map((d) => ({ uid: d.id, ...d.data() }))); }
                catch (e) { console.error(e); superior.set(rol, []); window._showToast?.("No se pudo cargar esa lista (permisos)", "error"); }
                pintar();
            }

            function lista() {
                const q = norm($("q").value), fa = $("f-agr").value, fi = $("f-inst").value, inact = $("ver-inactivos").checked;
                let base;
                if (rolesSuperiores.includes(rolActivo)) base = superior.get(rolActivo) || [];
                else base = miembros.filter((m) => rolActivo === "todos" || m.rango === rolActivo);
                return base.filter((m) => (inact || m.cuentaActiva !== false) && (!fa || m.agrupacion === fa) && (!fi || m.instrumento === fi) &&
                    (!q || norm(m.nombre).includes(q) || (verCorreo && norm(m.email || m.username).includes(q)) || norm(m.instrumento).includes(q) || norm(m.agrupacion).includes(q)))
                    .sort((a, b) => NIVEL[b.rango] - NIVEL[a.rango] || String(a.nombre).localeCompare(b.nombre, "es"));
            }

            function pintarChips() {
                const act = miembros.filter((m) => m.cuentaActiva !== false);
                const cuenta = (r) => act.filter((m) => m.rango === r).length;
                const chip = (id, texto, n) => `<button type="button" class="chip ${rolActivo === id ? "activo" : ""}" role="tab" aria-selected="${rolActivo === id}" data-rol="${id}">${esc(texto)}${n != null ? ` <span class="n">${n}</span>` : ""}</button>`;
                $("chips").innerHTML = chip("todos", "Todos", cargado ? act.length : null) + rolesNucleo.filter((r) => nivelVista > NIVEL[r] || r === "estudiante" || nivelVista >= NIVEL[r]).map((r) => chip(r, ROL[r][1], cargado ? cuenta(r) : null)).join("") +
                    (rolesSuperiores.length ? `<span class="sep" aria-hidden="true"></span>` + rolesSuperiores.map((r) => chip(r, ROL[r][1], null)).join("") : "");
            }

            function pintar() {
                pintarChips(); llenarFiltros();
                const grid = $("grid");
                if (!nucleo && !rolesSuperiores.includes(rolActivo)) { grid.innerHTML = `<div class="estado-vacio"><i class="fa-solid fa-building-columns"></i><h3>Elige un núcleo</h3><p>Usa el botón <strong>Núcleos</strong> (abajo a la derecha).</p></div>`; return; }
                const sup = rolesSuperiores.includes(rolActivo);
                if ((sup && superior.get(rolActivo) === null) || (!sup && !cargado)) { grid.innerHTML = Array.from({ length: 6 }, () => `<div class="skeleton" style="height:112px;border-radius:22px;"></div>`).join(""); return; }
                const l = lista();
                if (!l.length) { grid.innerHTML = `<div class="estado-vacio"><i class="fa-solid fa-users"></i><h3>No hay miembros para mostrar</h3><p>${$("q").value || $("f-agr").value || $("f-inst").value ? "Prueba con otra búsqueda o quita los filtros." : "Cuando se agreguen personas aparecerán aquí."}</p>${gestiona && !sup && permitidosCrear.length ? `<button type="button" class="btn btn-submit" id="vacio-nuevo"><i class="fa-solid fa-plus"></i> Agregar el primer miembro</button>` : ""}</div>`; $("vacio-nuevo")?.addEventListener("click", () => abrirFormulario(null)); return; }
                const mostrarRol = rolActivo === "todos";
                grid.innerHTML = l.map((m, i) => {
                    const puedeActuar = gestiona && m.uid !== real.uid && NIVEL[m.rango] < miNivel;
                    return `<article class="pin-card miembro ${m.cuentaActiva === false ? "inactivo" : ""}" style="animation-delay:${Math.min(i, 10) * 30}ms">
                        <div class="avatar" style="background:${colorAvatar(m.nombre)}" aria-hidden="true">${esc(iniciales(m.nombre))}</div>
                        <div class="miembro-info">
                            ${mostrarRol ? `<span class="eyebrow">${esc(ROL[m.rango]?.[0] || m.rango)}</span>` : ""}
                            <h3>${esc(m.nombre)}</h3>
                            ${m.instrumento ? `<p class="miembro-linea"><i class="fa-solid fa-guitar"></i>${esc(m.instrumento)}</p>` : ""}
                            ${m.agrupacion ? `<p class="miembro-linea"><i class="fa-solid fa-music"></i>${esc(m.agrupacion)}</p>` : ""}
                            ${verCorreo && (m.email || m.username) ? `<p class="miembro-linea"><i class="fa-solid fa-envelope"></i>${esc(m.email || m.username)}</p>` : ""}
                            <p class="miembro-linea"><i class="fa-regular fa-calendar"></i>Desde: ${esc(desde(m.fechaCreacion))}</p>
                            ${m.cuentaActiva === false ? `<span class="etiqueta-inactivo">Cuenta desactivada</span>` : ""}
                        </div>
                        ${puedeActuar ? `<div class="card-acciones"><button type="button" class="btn-mas" data-menu="${esc(m.uid)}" aria-label="Opciones de ${esc(m.nombre)}" aria-haspopup="menu"><i class="fa-solid fa-ellipsis"></i></button></div>` : ""}
                    </article>`;
                }).join("");
            }

            $("chips").addEventListener("click", (e) => { const b = e.target.closest("[data-rol]"); if (!b) return; rolActivo = b.dataset.rol; if (rolesSuperiores.includes(rolActivo)) cargarSuperior(rolActivo); pintar(); });
            ["q", "f-agr", "f-inst", "ver-inactivos"].forEach((id) => $(id).addEventListener("input", pintar));
            $("btn-nuevo").addEventListener("click", () => abrirFormulario(null));
            $("grid").addEventListener("click", (e) => {
                const b = e.target.closest("[data-menu]"); if (!b) return;
                const m = [...miembros, ...[...superior.values()].flatMap((x) => x || [])].find((x) => x.uid === b.dataset.menu); if (!m) return;
                const activa = m.cuentaActiva !== false;
                menuContextual(b, [
                    { icono: "fa-pen", texto: "Editar", onClick: () => abrirFormulario(m) },
                    ...(miNivel >= 70 ? [{ icono: "fa-key", texto: "Restablecer contraseña", onClick: () => resetClave(m) }] : []),
                    { icono: activa ? "fa-user-slash" : "fa-user-check", texto: activa ? "Desactivar cuenta" : "Activar cuenta", onClick: () => cambiarEstado(m, !activa) },
                    { separador: true },
                    { icono: "fa-trash", texto: "Eliminar", peligro: true, onClick: () => eliminar(m) },
                ]);
            });

            // ---------- contraseña (siempre blanco con texto negro, una sola vez) ----------
            function mostrarClave(titulo, nombre, clave) {
                const ov = document.createElement("div"); ov.className = "modal-overlay"; ov.style.display = "flex";
                ov.innerHTML = `<div class="modal-content modal-clave" role="dialog" aria-modal="true"><h2 style="padding:0">${esc(titulo)}</h2>
                    <p>Contraseña de <strong>${esc(nombre)}</strong></p><div class="clave-caja" id="clave-txt">${esc(clave)}</div>
                    <p>Se muestra <strong>una sola vez</strong>. Entrégala a la persona y pídele que la cambie.</p>
                    <div class="modal-acciones"><button type="button" class="btn btn-cerrar" id="clave-copiar"><i class="fa-regular fa-copy"></i> Copiar</button><button type="button" class="btn btn-submit" id="clave-ok">Entendido</button></div></div>`;
                document.body.appendChild(ov);
                ov.querySelector("#clave-copiar").addEventListener("click", async (e) => {
                    const b = e.currentTarget;
                    try { await navigator.clipboard.writeText(clave); } catch { const r = document.createRange(); r.selectNodeContents(ov.querySelector("#clave-txt")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand?.("copy"); }
                    b.innerHTML = '<i class="fa-solid fa-check"></i> ¡Copiado!'; setTimeout(() => (b.innerHTML = '<i class="fa-regular fa-copy"></i> Copiar'), 1200);
                });
                ov.querySelector("#clave-ok").addEventListener("click", () => ov.remove());
            }
            async function resetClave(m) {
                if (!(await window._confirmDialog(`Se generará una contraseña nueva para <strong>${esc(m.nombre)}</strong> y se cerrarán sus sesiones abiertas.`, { titulo: "¿Restablecer contraseña?", textoOk: "Sí, restablecer" }))) return;
                try { const r = await backendAPI.resetPassword(m.uid); mostrarClave("Contraseña restablecida", m.nombre, r.clave); } catch (e) { window._showToast?.("No se pudo restablecer: " + e.message, "error"); }
            }
            async function cambiarEstado(m, activa) {
                if (!activa && !(await window._confirmDialog(`<strong>${esc(m.nombre)}</strong> no podrá iniciar sesión ni usar el sistema hasta que reactives su cuenta.`, { titulo: "¿Desactivar cuenta?", textoOk: "Sí, desactivar" }))) return;
                try { await backendAPI.estadoCuenta(m.uid, activa); window._showToast?.(activa ? "Cuenta activada" : "Cuenta desactivada", "success"); if (rolesSuperiores.includes(rolActivo)) { superior.delete(rolActivo); cargarSuperior(rolActivo); } }
                catch (e) { window._showToast?.("No se pudo cambiar el estado: " + e.message, "error"); }
            }
            async function eliminar(m) {
                if (!(await window._confirmDialog(`Vas a eliminar a <strong>${esc(m.nombre)}</strong> de forma permanente (su cuenta y sus datos). Si solo quieres que no entre más, usa “Desactivar cuenta”.`, { titulo: "¿Eliminar miembro?", peligroso: true, textoOk: "Sí, eliminar" }))) return;
                try { await backendAPI.eliminarUsuario(m.uid); window._showToast?.("Miembro eliminado", "success"); if (rolesSuperiores.includes(rolActivo)) { superior.delete(rolActivo); cargarSuperior(rolActivo); } }
                catch (e) { window._showToast?.("No se pudo eliminar: " + e.message, "error"); }
            }

            // ---------- crear / editar (un solo panel, sin pasos) ----------
            async function abrirFormulario(m) {
                const editando = !!m;
                const rolInicial = editando ? m.rango : (permitidosCrear.includes(rolActivo) ? rolActivo : (permitidosCrear.includes("estudiante") ? "estudiante" : permitidosCrear[0]));
                const nucleos = esMulti && !editando ? [] : (esMulti ? await cargarTodosLosNucleos().catch(() => []) : []);
                const nombreNucleo = editando ? m.nucleo : nucleo?.nombre;
                const p = abrirPanel({
                    titulo: editando ? "Editar miembro" : "Nuevo miembro", ancho: "normal",
                    cuerpoHTML: `<div id="mf-ctx"></div>
                        ${editando ? "" : `<label for="mf-rol">Rol</label><select id="mf-rol">${permitidosCrear.map((r) => `<option value="${r}" ${r === rolInicial ? "selected" : ""}>${esc(ROL[r][0])}</option>`).join("")}</select>`}
                        <label for="mf-nombre">Nombre completo</label><input id="mf-nombre" type="text" maxlength="80" autocomplete="off" value="${esc(m?.nombre || "")}">
                        ${editando ? `<label>Correo</label><p class="ayuda" style="font-size:.95rem;opacity:1;margin:0">${esc(m.email || m.username || "—")}</p>` : `<label for="mf-correo">Correo electrónico</label><input id="mf-correo" type="email" maxlength="160" autocomplete="off" placeholder="nombre@correo.com">`}
                        <div id="mf-bloque-nucleo">
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:.7rem"><div><label for="mf-edad">Edad</label><input id="mf-edad" type="number" min="0" max="120" value="${m?.edad || ""}"></div><div></div></div>
                            <label for="mf-agr">Agrupación</label><select id="mf-agr"></select>
                            <label for="mf-inst">Instrumento</label><select id="mf-inst">${opcionesInstrumentoHTML(m?.instrumento || "")}</select>
                        </div>
                        ${editando && esMulti && nucleos.length ? `<label for="mf-mover">Núcleo</label><select id="mf-mover">${nucleos.filter((n) => session.role !== "director_regional" || n.estado === session.state).map((n) => `<option value="${esc(n.nombre)}|${esc(n.estado)}" ${n.nombre === m.nucleo && n.estado === m.estado ? "selected" : ""}>${esc(n.nombre)} (${esc(n.estado)})</option>`).join("")}</select><p class="ayuda">Si lo mueves de núcleo, se quita su agrupación.</p>` : ""}
                        ${!editando ? `<div id="mf-estado-bloque" style="display:none"><label for="mf-estado">Estado</label><select id="mf-estado"><option value="">Elige un estado…</option>${(session.role === "director_regional" ? [session.state] : ESTADOS_VENEZUELA).map((e) => `<option ${e === nucleo?.estado ? "selected" : ""} value="${esc(e)}">${esc(e)}</option>`).join("")}</select></div>` : ""}
                        <p class="error-campo" id="mf-err" role="alert"></p>`,
                    pieHTML: `<button type="button" class="btn btn-cerrar" id="mf-cancelar">Cancelar</button><button type="button" class="btn btn-submit" id="mf-guardar">${editando ? "Guardar cambios" : "Crear miembro"}</button>`,
                });
                const $p = (s) => p.panel.querySelector(s);
                enlazarSelectInstrumento($p("#mf-inst")); $p("#mf-cancelar").addEventListener("click", p.cerrar);
                const llenarAgr = () => { const sel = $p("#mf-agr"), cur = m?.agrupacion || ""; sel.innerHTML = `<option value="">Sin agrupación</option>` + agrupaciones.map((a) => `<option ${a === cur ? "selected" : ""} value="${esc(a)}">${esc(a)}</option>`).join(""); };
                llenarAgr();
                // El contexto (núcleo / estado) viene del núcleo activo: NO se vuelve a preguntar.
                const ajustarRol = () => {
                    const rol = editando ? m.rango : $p("#mf-rol").value, n = NIVEL[rol];
                    const ligadoNucleo = n <= 40, ligadoEstado = n <= 50;
                    $p("#mf-ctx").innerHTML = ligadoNucleo && nombreNucleo ? `<span class="rol-chip-fijo"><i class="fa-solid fa-location-dot"></i> ${esc(nombreNucleo)}${(editando ? m.estado : nucleo?.estado) ? " · " + esc(editando ? m.estado : nucleo.estado) : ""}</span>` : (editando ? "" : `<span class="rol-chip-fijo"><i class="fa-solid fa-globe"></i> ${n >= 60 ? "Alcance nacional" : "Alcance regional"}</span>`);
                    $p("#mf-bloque-nucleo").style.display = n <= 30 ? "block" : "none";
                    const eb = $p("#mf-estado-bloque"); if (eb) eb.style.display = !ligadoNucleo && ligadoEstado ? "block" : "none";
                };
                ajustarRol(); $p("#mf-rol")?.addEventListener("change", ajustarRol);
                const err = $p("#mf-err"), btn = $p("#mf-guardar");
                const guardar = async () => {
                    err.textContent = ""; const nombre = $p("#mf-nombre").value.trim(); if (nombre.length < 2) { err.textContent = "Escribe el nombre completo."; $p("#mf-nombre").focus(); return; }
                    const rol = editando ? m.rango : $p("#mf-rol").value, n = NIVEL[rol];
                    let agr = n <= 30 ? $p("#mf-agr").value : "", inst = n <= 30 ? $p("#mf-inst").value : "";
                    if (inst === "__otro__") inst = ""; const edad = Math.max(0, Math.min(120, parseInt($p("#mf-edad").value, 10) || 0));
                    btn.disabled = true; const t0 = btn.textContent; btn.textContent = "Guardando…";
                    try {
                        if (editando) {
                            const datos = { nombre, edad, agrupacion: agr, instrumento: inst };
                            const mov = $p("#mf-mover")?.value;
                            if (mov) { const [nn, ee] = mov.split("|"); if (nn !== m.nucleo || ee !== m.estado) { datos.nucleo = nn; datos.estado = ee; datos.agrupacion = ""; } }
                            await updateDoc(doc(db, "usuarios", m.uid), datos); window._showToast?.("Cambios guardados", "success"); p.cerrar();
                        } else {
                            const correo = $p("#mf-correo").value.trim();
                            if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo)) { err.textContent = "Escribe un correo válido."; btn.disabled = false; btn.textContent = t0; return; }
                            let estado = n <= 40 ? (nucleo?.estado || "") : (n === 50 ? ($p("#mf-estado").value || "") : ""), nuc = n <= 40 ? (nucleo?.nombre || "") : "";
                            if (n === 50 && !estado) { err.textContent = "Elige el estado del director regional."; btn.disabled = false; btn.textContent = t0; return; }
                            const r = await window.Auth.registerUser(correo, nombre, rol, agr, estado, nuc, edad, inst);
                            if (!r.success) throw new Error(r.error || "Error desconocido");
                            p.cerrar(); mostrarClave("Cuenta creada", nombre, r.clave);
                            if (rolesSuperiores.includes(rol)) { superior.delete(rol); if (rolActivo === rol) cargarSuperior(rol); }
                        }
                    } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = t0; }
                };
                btn.addEventListener("click", guardar);
            }
            window.UI?.render?.();
        }
        if (window.Auth?.getSession()) iniciar(); else window.addEventListener("auth-ready", iniciar, { once: true });

    </script>
</body>
</html>
