    <meta charset="UTF-8">

<link rel="stylesheet" href="estilos.css?v=16.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .back-link { display:inline-block; margin:1.5rem 0; color:var(--color-primario); font-weight:600; text-decoration:none; cursor:pointer; border:none; background:transparent; font-size:1rem; }
        .back-link:hover { text-decoration: underline; }
        .roles-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:20px; margin-top:20px; }
        .rol-card { background:var(--color-blanco); border:2px solid var(--color-borde); border-radius:var(--border-radius); padding:2rem 1.5rem; text-align:center; cursor:pointer; transition:var(--transition-normal); box-shadow:var(--shadow-card); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.5rem; }
        .rol-card:hover { border-color:var(--color-primario); transform:translateY(-4px); box-shadow:var(--shadow-hover); }
        .rol-card .icono { font-size:2.5rem; }
        .selecciones-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:15px; margin-top:20px; }
        .seleccion-card { background:var(--color-blanco); border:1px solid var(--color-borde); border-radius:var(--border-radius); padding:1rem; text-align:center; cursor:pointer; font-weight:600; color:var(--color-texto); transition:var(--transition-fast); box-shadow:0 2px 5px rgba(0,0,0,0.05); }
        .seleccion-card:hover { background:var(--color-primario); color:white; transform:scale(1.03); }
        .miembros-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; margin-top:20px; }
        .persona-card { background:var(--color-blanco); border:1px solid var(--color-borde); border-radius:var(--border-radius); padding:1.5rem; text-align:center; box-shadow:var(--shadow-card); position:relative; transition:var(--transition-fast); display:flex; flex-direction:column; align-items:center; gap:0.4rem; }
        .persona-card:hover { box-shadow:var(--shadow-hover); transform:translateY(-2px); }
        .avatar { width:64px; height:64px; background:var(--color-primario); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.5rem; margin:0 auto 0.8rem; }
        /* CORREGIDO 2026-09-06: antes cada tarjeta podía tener hasta 4
           botones circulares de 28px (24px en celular) apilados en la
           esquina, cada uno solo con un emoji sin ninguna etiqueta visible
           — difíciles de diferenciar y de tocar en el teléfono. Ahora es
           un solo botón (⋮) que abre un menú con las mismas acciones, cada
           una con su ícono Y su texto — mismo componente visual que ya usa
           el menú de usuario (arriba a la derecha de toda la app). */
        .card-menu-btn {
            display: none;
            position: absolute; top: 10px; right: 10px;
            width: 32px; height: 32px;
            background: var(--color-fondo); color: var(--color-texto-claro);
            border: 1px solid var(--color-borde); border-radius: 50%;
            cursor: pointer; font-size: 1.1rem; line-height: 1;
            align-items: center; justify-content: center;
            transition: var(--transition-fast);
        }
        .is-admin .card-menu-btn { display: flex; }
        .card-menu-btn:hover { background: var(--color-secundario); color: var(--color-primario); }
        .card-menu {
            position: absolute; top: 44px; right: 10px;
            background: var(--color-blanco); color: var(--color-texto);
            border-radius: var(--border-radius-sm); box-shadow: var(--shadow-modal);
            padding: 0.5rem; min-width: 210px; text-align: left; font-size: 0.85rem;
            z-index: 20; opacity: 0; visibility: hidden; transform: translateY(6px);
            transition: var(--transition-fast);
        }
        .card-menu.visible { opacity: 1; visibility: visible; transform: translateY(0); }
        .card-menu-item {
            width: 100%; display: flex; align-items: center; gap: 0.6rem;
            background: none; border: none; padding: 0.6rem 0.7rem; border-radius: 8px;
            cursor: pointer; font-weight: 600; color: var(--color-texto);
            font-size: 0.85rem; text-align: left; transition: var(--transition-fast);
        }
        .card-menu-item:hover { background: var(--color-secundario); color: var(--color-primario); }
        .card-menu-item.peligro { color: var(--color-acento); }
        .card-menu-item.peligro:hover { background: #fde8e8; }
        .card-menu-item:disabled { opacity: 0.5; cursor: not-allowed; }
        .spinner { display:flex; justify-content:center; padding:2rem; }
        .spinner::after { content:""; width:40px; height:40px; border:4px solid var(--color-borde); border-top-color:var(--color-primario); border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .top-controls { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:1rem; }
        .breadcrumb { font-size:0.9rem; color:var(--color-texto-claro); margin-bottom:1rem; }
        .breadcrumb span { font-weight:600; color:var(--color-primario); }

        @media (max-width: 768px) {
            .roles-grid, .selecciones-grid, .miembros-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
            .rol-card { padding: 1.2rem 0.8rem; }
            .rol-card .icono { font-size: 1.8rem; }
            .persona-card { padding: 1rem; }
            .avatar { width: 52px; height: 52px; font-size: 1.2rem; margin-bottom: 0.5rem; }
            .card-menu { min-width: 190px; font-size: 0.8rem; }
            .top-controls { gap: 0.5rem; }
            .titulo-pagina { font-size: 1.2rem; }
        }
    </style>
</head>

    <div class="modal-overlay" id="modal-password" style="display:none;">
        <div class="modal-content" style="text-align:center;">
            <h2 style="color:var(--color-primario);">Contraseña generada</h2>

            <button id="btn-copiar-password" class="btn btn-submit" style="margin-right:0.5rem;">📋 Copiar al portapapeles</button>

    <script type="module" src="auth.js?v=16.0"></script>
    <script type="module" src="ui-manager.js?v=16.0"></script>
    <script type="module">
        import { db, auth } from "./firebase-init.js";
        import { collection, query, where, getDocs, doc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
        import { fetchSignInMethodsForEmail } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
        import { backendAPI } from "./backend-api.js";
        import { ESTADOS_VENEZUELA, crearNucleo as crearNucleoCompartido, cargarNucleosPorEstado as cargarNucleosCompartido } from "./ubicaciones.js";

        // Constantes
        const JERARQUIA = { owner_supremo:70, director_nacional:60, director_regional:50, director_nucleo:40, admin:30, profesor:20, estudiante:10 };
        const CATEGORIAS = [
            { clave:"owner_supremo", icono:"👑", label:"Owner Supremo" },
            { clave:"director_nacional", icono:"🇻🇪", label:"Directores Nacionales" },
            { clave:"director_regional", icono:"🌎", label:"Directores Regionales" },
            { clave:"director_nucleo", icono:"🏫", label:"Directores de Núcleo" },
            { clave:"admin", icono:"🛡️", label:"Administradores" },
            { clave:"profesor", icono:"👩‍🏫", label:"Profesores" },
            { clave:"estudiante", icono:"👦", label:"Estudiantes" }
        ];

        let historyStack = ["main"];
        let currentContext = { rol:null, estado:null, nucleo:null };

        // Helpers
        const $ = (id) => document.getElementById(id);
        const cerrarModal = (id) => { $(id).style.display = "none"; };
        const showSpinner = () => { $("miembros-vista").innerHTML = '<div class="spinner"></div>'; };
        const getRoleLabel = (clave) => (CATEGORIAS.find(c => c.clave === clave) || {}).label || clave;
        const llenarSelect = (id, opciones, val = "") => {
            const s = $(id); if(!s) return;
            s.innerHTML = '<option value="">Seleccione...</option>';
            opciones.forEach(op => { const o = document.createElement("option"); o.value = op; o.textContent = op; if(op === val) o.selected = true; s.appendChild(o); });
        };
        // El módulo compartido ya invalida su propia caché cuando alguien crea,
        // renombra o elimina un núcleo (ver ubicaciones.js), así que acá NO hace
        // falta forzar:true — usar la caché ahorra una consulta a Firestore cada
        // vez que se abre un selector de estado, sin arriesgar datos viejos.
        const cargarNucleosPorEstado = (estado) => cargarNucleosCompartido(estado);
        const toggleCampos = (rango, prefijo) => {
            const re = document.getElementById(`row-${prefijo}-estado`);
            const rn = document.getElementById(`row-${prefijo}-nucleo`);
            const lvl = JERARQUIA[rango];
            re.style.display = lvl >= 60 ? "none" : "flex";
            rn.style.display = lvl >= 50 ? "none" : "flex";
        };

        function initMiembros() {
            if(!window.Auth?.getSession()) { location.href = "index.html"; return; }
            const container = $("miembros-container");
            const session = window.Auth.getSession();
            const miNivel = JERARQUIA[session.role] || 0;
            if(miNivel >= 30) container.classList.add("is-admin");

            // Antes: Cloud Functions callable (requerían plan Blaze). Ahora: backendAPI (Vercel).

            const puedeVerCasilla = (rol) => {
                const nivel = JERARQUIA[rol];
                if(miNivel === 70) return true;
                if(nivel === 70) return false;
                if(miNivel >= nivel) return true;
                if(miNivel === 50 && nivel === 60) return true;
                if(miNivel === 40 && nivel === 50) return true;
                if(miNivel <= 30 && nivel <= 40) return true;
                return false;
            };

            const navigateTo = (vista) => { historyStack.push(vista); renderizarPantalla(); };

            $("btn-atras").addEventListener("click", () => {
                if(historyStack.length > 1) { historyStack.pop(); renderizarPantalla(); }
            });

            async function renderizarPantalla() {
                const vistaActual = historyStack[historyStack.length-1];
                const vc = $("miembros-vista");
                const titulo = $("titulo-vista");
                const bc = $("breadcrumb-container");
                const btnAtras = $("btn-atras");
                const btnPanel = $("btn-panel");
                vc.innerHTML = "";

                if(vistaActual === "main") {
                    btnAtras.style.display = "none";
                    btnPanel.style.display = "inline-block";
                    titulo.textContent = "Directorio Institucional";
                    bc.innerHTML = "Seleccione el departamento que desea consultar.";
                    currentContext = { rol:null, estado:null, nucleo:null };
                } else {
                    btnAtras.style.display = "inline-block";
                    btnPanel.style.display = "none";
                }

                // ---------- PANTALLA PRINCIPAL ----------
                if(vistaActual === "main") {
                    const grid = document.createElement("div"); grid.className = "roles-grid";
                    CATEGORIAS.forEach(cat => {
                        if(!puedeVerCasilla(cat.clave)) return;
                        const card = document.createElement("div"); card.className = "rol-card";
                        card.innerHTML = `<span class="icono">${cat.icono}</span><h3>${cat.label}</h3>`;
                        card.addEventListener("click", () => {
                            currentContext.rol = cat.clave;
                            const dest = JERARQUIA[cat.clave];
                            if(dest >= 60) navigateTo("miembros");
                            else if(miNivel >= 60) navigateTo("estados");
                            else if(miNivel === 50) {
                                currentContext.estado = session.state;
                                navigateTo(dest === 50 ? "miembros" : "nucleos");
                            } else {
                                currentContext.estado = session.state;
                                currentContext.nucleo = session.nucleus || session.nucleo;
                                navigateTo("miembros");
                            }
                        });
                        grid.appendChild(card);
                    });
                    vc.appendChild(grid);
                }
                // ---------- ESTADOS ----------
                else if(vistaActual === "estados") {
                    titulo.textContent = `Seleccione el Estado (${getRoleLabel(currentContext.rol)})`;
                    const grid = document.createElement("div"); grid.className = "selecciones-grid";
                    ESTADOS_VENEZUELA.forEach(est => {
                        const card = document.createElement("div"); card.className = "seleccion-card";
                        card.textContent = est;
                        card.addEventListener("click", () => {
                            currentContext.estado = est;
                            navigateTo(JERARQUIA[currentContext.rol] === 50 ? "miembros" : "nucleos");
                        });
                        grid.appendChild(card);
                    });
                    vc.appendChild(grid);
                }
                // ---------- NÚCLEOS ----------
                else if(vistaActual === "nucleos") {
                    titulo.textContent = `Núcleos de ${currentContext.estado}`;
                    showSpinner();
                    let nucleos;
                    try {
                        nucleos = await cargarNucleosPorEstado(currentContext.estado);
                    } catch (err) {
                        // Antes: no había try/catch acá, así que un fallo dejaba el
                        // spinner girando para siempre — la página "cargaba" pero
                        // quedaba completamente inutilizable, sin aviso ni forma de
                        // reintentar sin recargar todo.
                        console.error("No se pudieron cargar los núcleos:", err);
                        vc.innerHTML = `<div style="text-align:center;padding:2.5rem 1rem;">
                            <p style="color:var(--color-acento);font-weight:600;margin-bottom:1rem;">⚠️ No se pudieron cargar los núcleos de ${currentContext.estado}. Revisá tu conexión.</p>
                            <button type="button" class="btn btn-submit" id="btn-reintentar-nucleos-miembros">🔄 Reintentar</button>
                        </div>`;
                        $("btn-reintentar-nucleos-miembros").addEventListener("click", renderizarPantalla);
                        window._showToast?.("No se pudieron cargar los núcleos.", "error");
                        return;
                    }
                    vc.innerHTML = "";

                    // owner_supremo / director_nacional / director_regional (en su propio estado)
                    // pueden dar de alta núcleos nuevos — antes no existía forma de hacerlo.
                    const puedeCrearNucleo = miNivel === 70 || miNivel === 60 ||
                        (miNivel === 50 && currentContext.estado === session.state);
                    if (puedeCrearNucleo) {
                        const topControls = document.createElement("div");
                        topControls.style.cssText = "display:flex;gap:0.6rem;margin-bottom:1rem;max-width:420px;";
                        topControls.innerHTML = `
                            <input type="text" id="input-nuevo-nucleo-rapido" class="modal-input" placeholder="Nombre del nuevo núcleo…" style="flex:1;" />
                            <button type="button" id="btn-crear-nucleo-rapido" class="btn btn-submit" style="flex-shrink:0;">+ Crear</button>
                        `;
                        vc.appendChild(topControls);
                        const inputNuevo = document.getElementById("input-nuevo-nucleo-rapido");
                        const btnNuevo = document.getElementById("btn-crear-nucleo-rapido");
                        const crear = async () => {
                            const nombre = inputNuevo.value.trim();
                            if (!nombre) { inputNuevo.focus(); return; }
                            btnNuevo.disabled = true; btnNuevo.textContent = "Creando…";
                            try {
                                await crearNucleoCompartido(nombre, currentContext.estado);
                                window._showToast("Núcleo \"" + nombre + "\" creado", "success");
                                renderizarPantalla();
                            } catch (err) {
                                window._showToast("Error al crear núcleo: " + err.message, "error");
                                btnNuevo.disabled = false; btnNuevo.textContent = "+ Crear";
                            }
                        };
                        btnNuevo.addEventListener("click", crear);
                        inputNuevo.addEventListener("keydown", (e) => { if (e.key === "Enter") crear(); });
                    }

                    if(!nucleos.length) {
                        vc.innerHTML += `<p style="text-align:center;padding:2rem;">No hay núcleos registrados en ${currentContext.estado}.</p>`;
                        return;
                    }
                    const grid = document.createElement("div"); grid.className = "selecciones-grid";
                    nucleos.forEach(nuc => {
                        const card = document.createElement("div"); card.className = "seleccion-card";
                        card.textContent = nuc;
                        card.addEventListener("click", () => { currentContext.nucleo = nuc; navigateTo("miembros"); });
                        grid.appendChild(card);
                    });
                    vc.appendChild(grid);
                }
                // ---------- MIEMBROS (solo activos) ----------
                else if(vistaActual === "miembros") {
                    titulo.textContent = getRoleLabel(currentContext.rol);
                    let ruta = `<span>Rol:</span> ${getRoleLabel(currentContext.rol)}`;
                    if(currentContext.estado && JERARQUIA[currentContext.rol] <= 50) ruta += ` &rarr; <span>Estado:</span> ${currentContext.estado}`;
                    if(currentContext.nucleo && JERARQUIA[currentContext.rol] <= 40) ruta += ` &rarr; <span>Núcleo:</span> ${currentContext.nucleo}`;
                    bc.innerHTML = ruta;

                    const topControls = document.createElement("div"); topControls.className = "top-controls";
                    const nivelDestino = JERARQUIA[currentContext.rol];
                    const puedoModificar = miNivel > nivelDestino || miNivel === 70;

                    if(puedoModificar) {
                        const btnAdd = document.createElement("button"); btnAdd.className = "btn btn-submit";
                        btnAdd.textContent = "+ Nuevo Registro";
                        btnAdd.addEventListener("click", () => {
                            $("persona-rango").innerHTML = `<option value="${currentContext.rol}">${getRoleLabel(currentContext.rol)}</option>`;
                            $("persona-nombre").value = $("persona-email").value = $("persona-agrupacion").value = "";
                            $("persona-edad").value = "0";
                            const selEstado = $("persona-estado");
                            selEstado.innerHTML = '<option value="">Seleccione un estado...</option>';
                            ESTADOS_VENEZUELA.forEach(est => { const o = document.createElement("option"); o.value = est; o.textContent = est; if(est === currentContext.estado) o.selected = true; selEstado.appendChild(o); });
                            $("persona-nucleo").innerHTML = '<option value="">Seleccione un estado primero...</option>';
                            toggleCampos(currentContext.rol, 'persona');
                            if(currentContext.estado) cargarNucleosPorEstado(currentContext.estado).then(nucs => llenarSelect("persona-nucleo", nucs, currentContext.nucleo));
                            $("modal-persona").style.display = "flex";
                        });
                        topControls.appendChild(btnAdd);
                    }
                    // v3.0 (P-44): exportar a CSV la lista visible, para
                    // llevársela sin conexión (se completa con los datos una
                    // vez que terminan de cargar, más abajo).
                    const btnExportarCSV = document.createElement("button");
                    btnExportarCSV.className = "btn btn-cerrar";
                    btnExportarCSV.innerHTML = '<i class="fa-solid fa-file-csv"></i> Exportar CSV';
                    btnExportarCSV.disabled = true;
                    topControls.appendChild(btnExportarCSV);
                    vc.appendChild(topControls);

                    // v3.0 (G-28): buscador por nombre o correo dentro de esta
                    // lista — antes la única forma de llegar a una persona
                    // era navegar rol → estado → núcleo sin poder escribir un
                    // nombre y encontrarlo directo.
                    const buscadorWrap = document.createElement("div");
                    buscadorWrap.className = "buscador-caja";
                    buscadorWrap.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Buscar por nombre o correo…"><button type="button" class="buscador-limpiar" aria-label="Limpiar búsqueda"><i class="fa-solid fa-xmark"></i></button>`;
                    vc.appendChild(buscadorWrap);
                    const inputBuscar = buscadorWrap.querySelector("input");
                    const filtrarTarjetas = () => {
                        const texto = inputBuscar.value.trim().toLowerCase();
                        buscadorWrap.classList.toggle("con-texto", !!texto);
                        let visibles = 0;
                        gridM.querySelectorAll(".persona-card").forEach(c => {
                            const coincide = !texto || c.dataset.busqueda.includes(texto);
                            c.style.display = coincide ? "" : "none";
                            if (coincide) visibles++;
                        });
                        let msgVacio = gridM.querySelector(".busqueda-sin-resultados");
                        if (texto && visibles === 0) {
                            if (!msgVacio) {
                                msgVacio = document.createElement("p");
                                msgVacio.className = "busqueda-sin-resultados";
                                msgVacio.style.gridColumn = "1/-1"; msgVacio.style.textAlign = "center";
                                gridM.appendChild(msgVacio);
                            }
                            msgVacio.textContent = `Nadie coincide con "${texto}".`;
                        } else if (msgVacio) { msgVacio.remove(); }
                    };
                    inputBuscar.addEventListener("input", filtrarTarjetas);
                    buscadorWrap.querySelector(".buscador-limpiar").addEventListener("click", () => { inputBuscar.value = ""; filtrarTarjetas(); });

                    const gridM = document.createElement("div"); gridM.className = "miembros-grid";
                    const spinner = document.createElement("div"); spinner.className = "spinner"; vc.appendChild(spinner);

                    // 🔧 CORRECCIÓN 1.1: filtro cuentaActiva + estado geográfico
                    let q = query(
                        collection(db, "usuarios"),
                        where("rango", "==", currentContext.rol),
                        where("cuentaActiva", "==", true)
                    );
                    if (nivelDestino <= 50 && currentContext.estado) {
                        q = query(q, where("estado", "==", currentContext.estado));
                    }
                    if (nivelDestino <= 40 && currentContext.nucleo) {
                        q = query(q, where("nucleo", "==", currentContext.nucleo));
                    }

                    try {
                        const snap = await getDocs(q);
                        spinner.remove();
                        // v3.0 (P-44): ya tenemos los datos → habilita el CSV
                        btnExportarCSV.disabled = false;
                        btnExportarCSV.addEventListener("click", () => {
                            const filas = snap.docs.map(d => { const p = d.data(); return [p.nombre, p.email, p.agrupacion, p.estado, p.nucleo].map(v => `"${(v || "").toString().replace(/"/g, '""')}"`).join(","); });
                            const csv = "Nombre,Correo,Agrupación,Estado,Núcleo\n" + filas.join("\n");
                            const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement("a");
                            a.href = url; a.download = `miembros-${getRoleLabel(currentContext.rol)}-${new Date().toISOString().slice(0,10)}.csv`;
                            a.click();
                            URL.revokeObjectURL(url);
                        });
                        if(snap.empty) {
                            gridM.innerHTML = `<p style="grid-column:1/-1;text-align:center;">No se encontraron registros activos para esta selección.</p>`;
                        } else {
                            snap.docs.forEach(d => {
                                const p = { id:d.id, ...d.data() };
                                const nombreSeguro = window._escapeHtml(p.nombre);
                                const card = document.createElement("div"); card.className = "persona-card";
                                // v3.0 (G-28): usado por el buscador de arriba
                                card.dataset.busqueda = `${(p.nombre || "").toLowerCase()} ${(p.email || "").toLowerCase()}`;
                                // v3.0 (G-12): color de avatar por rol, igual que en la barra
                                // superior y Configuración.
                                const colorAvatar = window._colorPorRol ? window._colorPorRol(p.rango) : "";
                                card.innerHTML = `
                                    <div class="avatar" style="background:${colorAvatar};">${window._escapeHtml(p.nombre?.charAt(0)) || "?"}</div>
                                    <strong>${nombreSeguro || "Sin nombre"}</strong>
                                    <p style="font-size:0.85rem;color:var(--color-texto-claro);">${window._escapeHtml(p.email)}</p>
                                    <p style="font-size:0.85rem;font-weight:600;margin-top:0.5rem;">🎵 ${window._escapeHtml(p.agrupacion) || "N/A"}</p>
                                    <!-- v3.0 (P-43): este dato ya se guardaba (requiresPasswordChange)
                                         pero no se mostraba en ningún lado de la interfaz. -->
                                    ${p.requiresPasswordChange ? `<span class="badge-pill badge-temporal" title="Todavía no cambió/usó la contraseña temporal que se le generó">🔑 Contraseña temporal</span>` : ""}
                                    <hr style="margin:10px 0;border:0;border-top:1px solid var(--color-borde);width:100%;">
                                `;
                                if(JERARQUIA[p.rango] <= 40) card.innerHTML += `<p style="font-size:0.8rem;color:var(--color-primario);">📍 ${window._escapeHtml(p.nucleo) || 'Núcleo vacío'}</p>`;
                                if(JERARQUIA[p.rango] <= 50) card.innerHTML += `<p style="font-size:0.75rem;color:var(--color-texto-claro);">${window._escapeHtml(p.estado) || 'Estado vacío'}</p>`;
                                // v3.0 (P-46): fecha de alta de la cuenta, ya se guardaba y no se mostraba.
                                if (p.fechaCreacion) card.innerHTML += `<p style="font-size:0.68rem;color:var(--color-texto-claro);opacity:0.75;">Alta: ${new Date(p.fechaCreacion).toLocaleDateString("es-VE")}</p>`;

                                if(puedoModificar) {
                                    // CORREGIDO 2026-09-06: antes había hasta 4 botones circulares
                                    // apilados en la esquina (✎ ✖ 🗑️ 🔑), cada uno solo un ícono sin
                                    // texto — difíciles de diferenciar y de tocar en el celular. Ahora
                                    // es un solo botón (⋮) que abre un menú con las mismas acciones,
                                    // cada una con ícono Y texto. Mismo patrón (abrir/cerrar, clic
                                    // afuera cierra) que ya usa el menú de usuario arriba a la derecha.
                                    const btnMenu = document.createElement("button");
                                    btnMenu.className = "card-menu-btn";
                                    btnMenu.innerHTML = "⋮";
                                    btnMenu.title = "Acciones";
                                    card.appendChild(btnMenu);

                                    const menu = document.createElement("div");
                                    menu.className = "card-menu";
                                    card.appendChild(menu);

                                    const itemEditar = document.createElement("button");
                                    itemEditar.className = "card-menu-item";
                                    itemEditar.innerHTML = `<i class="fa-solid fa-pen"></i> Editar`;
                                    itemEditar.addEventListener("click", async (e) => {
                                        e.stopPropagation();
                                        cerrarMenu();
                                        $("editar-id").value = p.id;
                                        $("editar-rango").value = p.rango;
                                        $("editar-nombre").value = p.nombre || "";
                                        $("editar-email").value = p.email || "";
                                        $("editar-edad").value = p.edad || 0;
                                        $("editar-agrupacion").value = p.agrupacion || "";
                                        toggleCampos(p.rango, 'editar');
                                        llenarSelect("editar-estado", ESTADOS_VENEZUELA, p.estado);
                                        if(p.estado) {
                                            const nucs = await cargarNucleosPorEstado(p.estado);
                                            llenarSelect("editar-nucleo", nucs, p.nucleo);
                                        }
                                        $("modal-editar").style.display = "flex";
                                    });
                                    menu.appendChild(itemEditar);

                                    // Botón RESET (solo owner_supremo) — recuperar el acceso de
                                    // alguien que quedó afuera. Distinto de "cambiar mi propia
                                    // contraseña" (eso vive en Configuración, arriba a la derecha).
                                    if(session.role === "owner_supremo") {
                                        const itemReset = document.createElement("button");
                                        itemReset.className = "card-menu-item";
                                        itemReset.innerHTML = `<i class="fa-solid fa-key"></i> Restablecer contraseña`;
                                        itemReset.addEventListener("click", async (e) => {
                                            e.stopPropagation();
                                            cerrarMenu();
                                            // v3.0 (G-02): reemplaza el confirm() nativo
                                            const ok = await window._confirmDialog(`Vas a generar una contraseña nueva para <strong>${nombreSeguro}</strong> (${window._escapeHtml(p.email)}). La contraseña actual dejará de funcionar.`, { titulo: "¿Generar nueva contraseña?", textoOk: "Sí, generar" });
                                            if (!ok) return;
                                            itemReset.disabled = true;
                                            try {
                                                const nueva = window.Auth.generarClaveSegura();
                                                const res = await backendAPI.resetPassword(p.id, nueva);
                                                if(res.success) {
                                                    $("password-display").textContent = nueva;
                                                    $("modal-password").style.display = "flex";
                                                    window._showToast("Contraseña actualizada. Se obligará a cambiarla.","success");
                                                }
                                            } catch(err) { window._showToast("Error: "+err.message,"error"); }
                                            finally { itemReset.disabled = false; }
                                        });
                                        menu.appendChild(itemReset);
                                    }

                                    // Botón DESACTIVAR (usa cuentaActiva)
                                    const itemDesactivar = document.createElement("button");
                                    itemDesactivar.className = "card-menu-item";
                                    itemDesactivar.innerHTML = `<i class="fa-solid fa-ban"></i> Desactivar`;
                                    itemDesactivar.addEventListener("click", async (e) => {
                                        e.stopPropagation();
                                        cerrarMenu();
                                        // v3.0 (P-47): confirmación con resumen (nombre + rol + núcleo) en
                                        // vez de solo el nombre pelado del confirm() nativo.
                                        const ok = await window._confirmDialog(
                                            `Vas a desactivar a <strong>${nombreSeguro}</strong> — ${window._escapeHtml(window.Auth?.ROLES?.[p.rango]?.label || p.rango)}${p.nucleo ? ", núcleo " + window._escapeHtml(p.nucleo) : ""}. No podrá iniciar sesión hasta que se lo reactive.`,
                                            { titulo: "¿Desactivar usuario?", peligroso: true, textoOk: "Sí, desactivar" }
                                        );
                                        if (ok) {
                                            try {
                                                await updateDoc(doc(db,"usuarios",p.id), {
                                                    cuentaActiva: false,
                                                    fechaEliminacion: new Date().toISOString()
                                                });
                                                window._showToast("Usuario desactivado correctamente","success");
                                                renderizarPantalla();
                                            } catch (err) {
                                                window._showToast("Error al desactivar: " + err.message,"error");
                                            }
                                        }
                                    });
                                    menu.appendChild(itemDesactivar);

                                    // Botón ELIMINAR DEFINITIVAMENTE (borra Auth + Firestore de verdad,
                                    // libera el email para poder volver a registrarlo)
                                    const itemBorrar = document.createElement("button");
                                    itemBorrar.className = "card-menu-item peligro";
                                    itemBorrar.innerHTML = `<i class="fa-solid fa-trash"></i> Eliminar definitivamente`;
                                    itemBorrar.title = "Borra por completo y libera el email";
                                    itemBorrar.addEventListener("click", async (e) => {
                                        e.stopPropagation();
                                        cerrarMenu();
                                        // v3.0 (G-02): reemplaza el confirm() nativo — esta es la acción
                                        // más irreversible de toda la pantalla, así que el mensaje es
                                        // explícito sobre qué se pierde.
                                        const ok = await window._confirmDialog(
                                            `Esto borra por completo a <strong>${nombreSeguro}</strong> (cuenta, datos y acceso) y libera su correo (${window._escapeHtml(p.email)}) para volver a registrarlo. <u>No se puede deshacer.</u>`,
                                            { titulo: "¿Eliminar definitivamente?", peligroso: true, textoOk: "Sí, eliminar para siempre" }
                                        );
                                        if (!ok) return;
                                        itemBorrar.disabled = true;
                                        try {
                                            const res = await backendAPI.eliminarUsuario(p.id);
                                            if (res.success) {
                                                window._showToast("Usuario eliminado definitivamente", "success");
                                                renderizarPantalla();
                                            }
                                        } catch (err) {
                                            window._showToast("Error: " + err.message, "error");
                                            itemBorrar.disabled = false;
                                        }
                                    });
                                    menu.appendChild(itemBorrar);

                                    const cerrarMenu = () => menu.classList.remove("visible");
                                    btnMenu.addEventListener("click", (e) => {
                                        e.stopPropagation();
                                        // Cierra cualquier otro menú de tarjeta que haya quedado abierto,
                                        // para que nunca haya dos abiertos a la vez.
                                        document.querySelectorAll(".card-menu.visible").forEach(m => { if (m !== menu) m.classList.remove("visible"); });
                                        menu.classList.toggle("visible");
                                    });
                                    document.addEventListener("click", (e) => { if (!card.contains(e.target)) cerrarMenu(); });
                                }
                                gridM.appendChild(card);
                            });
                        }
                        vc.appendChild(gridM);
                    } catch(err) { spinner.remove(); vc.innerHTML = `<p style="color:red;">Error: ${err.message}</p>`; }
                }
            }

            // Listeners de selectores
            $("persona-estado").addEventListener("change", async (e) => {
                const val = e.target.value;
                const sel = $("persona-nucleo");
                sel.innerHTML = '<option value="">Cargando...</option>';
                if(!val) { sel.innerHTML = '<option value="">Seleccione un estado primero...</option>'; return; }
                try { llenarSelect("persona-nucleo", await cargarNucleosPorEstado(val)); }
                catch(err) { window._showToast("Error cargando núcleos","error"); }
            });
            $("editar-estado").addEventListener("change", async (e) => {
                const sel = $("editar-nucleo");
                sel.innerHTML = '<option value="">Cargando...</option>';
                if (!e.target.value) { sel.innerHTML = '<option value="">Seleccione un estado primero...</option>'; return; }
                try { llenarSelect("editar-nucleo", await cargarNucleosPorEstado(e.target.value)); }
                catch (err) { sel.innerHTML = '<option value="">⚠️ Error — probá de nuevo</option>'; window._showToast?.("Error cargando núcleos", "error"); }
            });

            // Guardar creación
            $("btn-guardar-persona").addEventListener("click", async () => {
                const email = $("persona-email").value.trim();
                const nombre = $("persona-nombre").value.trim();
                const edad = parseInt($("persona-edad").value)||0;
                const rango = currentContext.rol;
                const agrup = $("persona-agrupacion").value.trim();
                let estado = $("persona-estado").value;
                let nucleo = $("persona-nucleo").value;
                if(JERARQUIA[rango] >= 60) { estado = ""; nucleo = ""; }
                if(JERARQUIA[rango] === 50) { nucleo = ""; }
                if(!email || !nombre) { window._showToast("Nombre y email obligatorios","error"); return; }
                try {
                    if((await fetchSignInMethodsForEmail(auth, email)).length) { window._showToast("El correo ya existe.","error"); return; }
                    const res = await Auth.registerUser(email, nombre, rango, agrup, estado, nucleo, edad);
                    // v3.0 (G-29): antes esto se mostraba en un toast que se
                    // borraba solo a los 3.5s SIN botón de copiar — el mismo
                    // tipo de dato sensible que "Restablecer contraseña" sí
                    // mostraba en un modal con "Copiar". Ahora usan el mismo
                    // modal, para no arriesgar perder una clave que no se
                    // llegó a anotar a tiempo.
                    if(res.success) {
                        $("password-display").textContent = res.clave;
                        $("modal-password").style.display = "flex";
                        window._showToast("Usuario creado correctamente","success");
                        cerrarModal("modal-persona"); renderizarPantalla();
                    }
                    else window._showToast(res.error,"error");
                } catch(err) { window._showToast(err.message,"error"); }
            });

            // Guardar edición
            $("btn-guardar-edicion").addEventListener("click", async () => {
                const id = $("editar-id").value;
                const rango = $("editar-rango").value;
                const nombre = $("editar-nombre").value.trim();
                const agrupacion = $("editar-agrupacion").value.trim();
                const edad = parseInt($("editar-edad").value)||0;
                let estado = $("editar-estado").value;
                let nucleo = $("editar-nucleo").value;
                if(JERARQUIA[rango] >= 60) { estado = ""; nucleo = ""; }
                if(JERARQUIA[rango] === 50) { nucleo = ""; }
                if(!nombre) { window._showToast("El nombre es obligatorio","error"); return; }
                try {
                    await updateDoc(doc(db,"usuarios",id), { nombre, agrupacion, estado, nucleo, edad });
                    window._showToast("Usuario actualizado","success");
                    cerrarModal("modal-editar");
                    renderizarPantalla();
                } catch(err) { window._showToast(err.message,"error"); }
            });

            // Cierres y copiado
            $("btn-cerrar-modal-persona").addEventListener("click", () => cerrarModal("modal-persona"));
            $("persona-close-btn").addEventListener("click", () => cerrarModal("modal-persona"));
            $("btn-cerrar-modal-editar").addEventListener("click", () => cerrarModal("modal-editar"));
            $("editar-close-btn").addEventListener("click", () => cerrarModal("modal-editar"));
            $("btn-cerrar-password").addEventListener("click", () => cerrarModal("modal-password"));
            $("btn-copiar-password").addEventListener("click", async () => {
                const txt = $("password-display").textContent;
                try { await navigator.clipboard.writeText(txt); window._showToast("Contraseña copiada","success"); }
                catch {
                    const inp = document.createElement("input"); inp.value = txt; document.body.appendChild(inp);
                    inp.select(); document.execCommand("copy"); document.body.removeChild(inp);
                    window._showToast("Contraseña copiada","success");
                }
            });

            // Arranque único
            UI.render();
            renderizarPantalla();
        }

        if(window.Auth?.getSession()) initMiembros();
        else window.addEventListener("auth-ready", initMiembros, { once: true });
    </script>
</body>
</html>
